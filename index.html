<script>
(function () {
  function isLockOn() {
    try { return !!localStorage.getItem('portfolio-lock-credential-v1'); } catch (e) { return false; }
  }
  function show() {
    if (!isLockOn()) return;
    var el = document.getElementById('privacy-shield');
    if (el) el.style.display = 'flex';
  }
  function hide() {
    var el = document.getElementById('privacy-shield');
    if (el) el.style.display = 'none';
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) show(); else hide();
  });
  window.addEventListener('pagehide', show);
  window.addEventListener('blur', show);
  window.addEventListener('focus', hide);
})();
</script>

      close.style.cssText = 'position:absolute;top:8px;right:10px;background:none;border:none;color:#ffb4ae;font-size:16px;padding:4px;';

      box.appendChild(text);
      box.appendChild(close);
      document.body.appendChild(box);
    }

  window.addEventListener('unhandledrejection', function (e) {
    showError('Promise 오류: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
  });
  // 5초 안에 앱이 하나도 안 그려졌으면(=조용히 죽었으면) 알려준다.
  setTimeout(function () {
    var root = document.getElementById('root');
    if (root && root.children.length === 0 && !document.getElementById('fatal-error-box')) {
      showError('앱이 렌더링되지 않았어요. 화면을 아래로 당겨 새로고침하거나, 브라우저 캐시를 지운 뒤 다시 시도해 보세요.\n(캐시 문제라면 주소 끝에 ?v=2 를 붙여서 열면 확인됩니다)');
    }
  }, 5000);
})();
</script>

에요(1/PER − 국채 10년금리). 6%p 이상이면 주식이 매력적(저평가), 3%p 이하면 매력이 낮아 고평가로 봐요.",conc:"시가총액 상위 10종목이 시장 전체에서 차지하는 비중이에요. 55% 이상이면 소수 종목에 쏠린 과열 국면, 40% 이하면 고르게 분산된 상태로 봐요.",breadthK:"코스피에서 상승한 종목의 비율(20일 평균)이에요. 60% 이상이면 시장 전반이 오르는 과열, 40% 이하면 침체 국면으로 봐요. 최소 3일치가 쌓여야 판정해요.",breadthQ:"코스닥에서 상승한 종목의 비율(20일 평균)이에요. 60% 이상이면 과열, 40% 이하면 침체 국면으로 봐요. 최소 3일치가 쌓여야 판정해요.",vkospi:"코스피200의 예상 변동성, 이른바 '공포지수'예요. 30 이상이면 시장이 공포에 빠진 바닥권(저평가 신호), 15 이하면 지나치게 안심한 과열권(고평가 신호)으로 봐요.",spread:"국채 10년 금리에서 3년 금리를 뺀 값이에요. 0 아래로 내려가면(장단기 금리 역전) 과거에 경기 침체의 경고로 읽혀 왔어요. 점수에는 넣지 않아요.",mdep:"신용융자 잔고를 고객예탁금으로 나눈 값이에요. 빚을 내서 투자하는 비중을 보여주며, 40% 이상이면 빚투 과열, 25% 이하면 안정적이라고 봐요.",mgrowth:"신용융자 잔고가 1년 전보다 얼마나 늘었는지 보여줘요. +25% 이상이면 빚투가 빠르게 늘어난 과열, −5% 이하면 위축된 상태로 봐요.",sentiment:"소비자심리지수로, 100이 기준이에요. 108 이상이면 사람들이 낙관적으로 쏠린 상태(고평가 쪽), 92 이하면 비관적인 상태(저평가 쪽)로 봐요."},ms={pos:" 명목 지수는 장기적으로 오르기 때문에 이 위치는 늘 상위권으로 치우쳐서, 종합점수에는 넣지 않고 참고로만 보여줘요.",breadthK:" 20일 단기 지표라 장기 밸류에이션 점수를 흔들 수 있어서 종합점수에는 넣지 않고 참고로만 보여줘요.",breadthQ:" 20일 단기 지표라 장기 밸류에이션 점수를 흔들 수 있어서 종합점수에는 넣지 않고 참고로만 보여줘요.",conc:" 쏠림 정도를 보여줄 뿐 그 자체가 고평가를 뜻하지는 않아서 종합점수에는 넣지 않고 참고로만 보여줘요.",sentiment:" 소비자의 경기 체감이라 주식 투자심리와 연결이 약해서 종합점수에는 넣지 않고 참고로만 보여줘요."},hs={gap:" (이격도·÷GDP·÷수출은 같은 '지수 위치' 계열이라 묶어서 한 표로 반영해요.)","kospi-gdp":" (이격도·÷GDP·÷수출은 같은 '지수 위치' 계열이라 묶어서 한 표로 반영해요.)","kospi-exp":" (이격도·÷GDP·÷수출은 같은 '지수 위치' 계열이라 묶어서 한 표로 반영해요.)",per:" (PER·CAPE·위험프리미엄은 같은 '이익' 계열이라 묶어서 한 표로 반영해요.)",cape:" (PER·CAPE·위험프리미엄은 같은 '이익' 계열이라 묶어서 한 표로 반영해요.)",erp:" (PER·CAPE·위험프리미엄은 같은 '이익' 계열이라 묶어서 한 표로 반영해요.)",mcapexp:" (버핏지수와 같은 '경제 규모 대비 시총' 계열이라 묶어서 한 표로 반영해요.)",buffett:" (전체시총÷수출과 같은 '경제 규모 대비 시총' 계열이라 묶어서 한 표로 반영해요.)",mdep:" (신용융자 증가율과 같은 '빚투' 계열이라 묶어서 한 표로 반영해요.)",mgrowth:" (신용잔고÷예탁금과 같은 '빚투' 계열이라 묶어서 한 표로 반영해요.)"},vs=u=>{const y=String(u),h=y.replace(/^(kospi|kosdaq)-/,""),N=fs[y]||fs[h]||"";if(!N)return"";const R=ms[y]||ms[h]||"",T=y==="kosdaq-gap"?"":hs[y]||hs[h]||"",L={pbr:1,per:1,pbrQ:1,perQ:1,cape:1,vkospi:1}[y]?" 직접 입력한 값이 60일 넘게 지나면 '오래됨'으로 보고 점수에서 빼요.":"";return N+R+T+L
