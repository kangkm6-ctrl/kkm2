<div id="root"></div>
<script id="app-source" type="text/plain" data-presets="react">
const { useState, useEffect, useRef } = React;

const num = (v) => {
  const normalized = typeof v === "string" ? v.replace(/[\u2010-\u2015\u2212]/g, "-") : v;
  const n = parseFloat(normalized);
  return isNaN(n) ? 0 : n;
};

let __idCounter = 0;
const genId = () => `id-${Date.now()}-${__idCounter++}-${Math.random().toString(36).slice(2, 8)}`;

const pad2 = (n) => String(n).padStart(2, "0");
const yymmdd = () => {
  const d = new Date();
  return `${String(d.getFullYear()).slice(2)}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;
};
const sanitizeFileName = (s) => (s && s.trim() ? s.trim() : "제목없음").replace(/[\\/:*?"<>|]/g, "_");
const buildFileName = (title) => `${sanitizeFileName(title)}(${yymmdd()}).xlsx`;

// 문자열 유사도(0~1). 두 글자씩 묶은 바이그램을 서로 비교하는 Dice 계수 방식.
const toBigrams = (s) => {
  const norm = s.replace(/\s+/g, " ").trim().toLowerCase();
  const grams = [];
  for (let i = 0; i < norm.length - 1; i++) grams.push(norm.substring(i, i + 2));
  return grams;
};
const textSimilarity = (a, b) => {
  const ga = toBigrams(a);
  const gb = toBigrams(b);
  if (ga.length === 0 || gb.length === 0) {
    return a.replace(/\s+/g, " ").trim().toLowerCase() === b.replace(/\s+/g, " ").trim().toLowerCase() ? 1 : 0;
  }
  const counts = new Map();
  ga.forEach((g) => counts.set(g, (counts.get(g) || 0) + 1));
  let overlap = 0;
  gb.forEach((g) => {
    const c = counts.get(g) || 0;
    if (c > 0) { overlap++; counts.set(g, c - 1); }
  });
  return (2 * overlap) / (ga.length + gb.length);
};
const isDuplicateText = (text, others, threshold = 0.8) => others.some((t) => textSimilarity(text, t) >= threshold);

// "3 학이시습지...", "7.  그가..." 처럼 본문 맨 앞에 붙은 "숫자(+마침표/괄호 등) + 공백"은
// 순서를 잡는 데만 참고하고, 실제 저장되는 내용에서는 떼어낸다.
const splitLeadingNumber = (raw) => {
  const m = raw.match(/^\s*(\d{1,4})\s*[.)\-:]?\s+(\S[\s\S]*)$/);
  if (!m) return { leadingNumber: null, text: raw.trim() };
  return { leadingNumber: num(m[1]), text: m[2].trim() };
};

const buildQuotesWorkbook = (title, quotes) => {
  const rows = [...quotes]
    .sort((a, b) => (num(a.number) || 0) - (num(b.number) || 0))
    .map((q) => ({ "번호": q.number, "주요문": q.text }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{ "안내": "저장된 주요문 없음" }]), sanitizeFileName(title).slice(0, 31) || "주요문");
  return wb;
};

const BOOKS_KEY = "reading-summary-books-v2";

const seedBooks = [
  {
    id: genId(),
    title: "투자명언",
    learnedCount: 0,
    bookmarkQuoteId: null,
    readDate: new Date().toISOString().slice(0, 10),
    quotes: [
      { id: genId(), number: 1, text: "ROE와 영업이익율이 높아 해자가 있는 기업을 가지고 있어야 한다." },
      { id: genId(), number: 2, text: "학이시습지 불역열호(學而時習之 不亦說乎) : 배우고 때때로 익히면 또한 기쁘지 아니한가" },
      { id: genId(), number: 3, text: "물극필반(物極必反) : 사물이 극에 달하면 반드시 반전이 일어난다" },
      { id: genId(), number: 4, text: "니체의 삶의 태도\n메멘토 모리 (Memento Mori) : 죽음을 기억하라 (삶의 한계를 인지함)\n아모르 파티 (Amor Fati) : 운명을 사랑하라 (필연적인 삶의 과정을 수용함)\n카르페 디엠 (Carpe Diem) : 현재를 잡아라 / 오늘을 즐겨라 (지금을 적극적으로 살아감)" },
      { id: genId(), number: 5, text: "반드시 주식은 고점일 때 팔고 저점일 때 사야 한다." },
    ],
  },
];

function loadBooks() {
  try {
    const saved = JSON.parse(localStorage.getItem(BOOKS_KEY));
    return Array.isArray(saved) && saved.length > 0 ? saved : seedBooks;
  } catch (e) { return seedBooks; }
}

// ---- 교회설교요약 ----
const SERMONS_KEY = "reading-summary-sermons-v1";
const DEFAULT_PREACHER = "이규현 목사";

const toDateStr = (d) => {
  const y = d.getFullYear();
  const m = pad2(d.getMonth() + 1);
  const day = pad2(d.getDate());
  return `${y}-${m}-${day}`;
};
// "YYYY-MM-DD" 문자열을 로컬 자정 기준 Date로 만든다. new Date("YYYY-MM-DD")는 UTC 자정으로
// 해석되기 때문에, 한국(UTC+9) 등에서는 mostRecentSunday(로컬 자정 기준)와 비교할 때 최대 하루 어긋나서
// "오늘이 일요일인데도 생성 안 됨" 같은 버그가 생긴다. 항상 이 함수로 파싱해서 기준을 통일한다.
const parseLocalDate = (dateStr) => {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d);
};
const mostRecentSunday = (base) => {
  const d = new Date(base);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - d.getDay()); // getDay(): 0=일요일
  return d;
};
const makeSermon = (dateStr, preacher) => ({
  id: genId(),
  date: dateStr,
  title: "",
  scripture: "",
  preacher: preacher || DEFAULT_PREACHER,
  learnedCount: 0,
  bookmarkQuoteId: null,
  quotes: [],
});

// 마지막으로 만들어둔 설교 날짜 다음 주부터, 오늘이 속한 주의 일요일까지 빠진 일요일을 채워 넣는다.
// (웹앱은 앱이 닫혀있는 동안 정확히 "일요일 오전 5시"에 실행될 수는 없어서, 다음에 앱을 열 때 놓친 주를 한번에 보충한다.)
// deletedDates에 들어있는 날짜는 사용자가 수동으로 지운 것이므로 다시 자동 생성하지 않는다.
const ensureSundays = (list, deletedDates) => {
  const deleted = deletedDates || new Set();
  const latestSunday = mostRecentSunday(new Date());
  const next = [...list];
  const existingDates = new Set(next.map((s) => s.date));
  if (next.length === 0) {
    const seedDate = toDateStr(latestSunday);
    if (!deleted.has(seedDate)) next.push(makeSermon(seedDate));
    return next;
  }
  const lastPreacher = next.reduce((latest, s) => (s.date > latest.date ? s : latest), next[0]).preacher;
  let maxDateStr = next.reduce((m, s) => (s.date > m ? s.date : m), next[0].date);
  let cursor = parseLocalDate(maxDateStr);
  cursor.setDate(cursor.getDate() + 7);
  while (cursor <= latestSunday) {
    const ds = toDateStr(cursor);
    if (!existingDates.has(ds) && !deleted.has(ds)) {
      next.push(makeSermon(ds, lastPreacher));
      existingDates.add(ds);
    }
    cursor.setDate(cursor.getDate() + 7);
  }
  return next;
};

const DELETED_SERMON_DATES_KEY = "reading-summary-deleted-sermon-dates-v1";
function loadDeletedSermonDates() {
  try {
    const saved = JSON.parse(localStorage.getItem(DELETED_SERMON_DATES_KEY));
    return Array.isArray(saved) ? saved : [];
  } catch (e) { return []; }
}

function loadRawSermons() {
  try {
    const saved = JSON.parse(localStorage.getItem(SERMONS_KEY));
    return Array.isArray(saved) ? saved : [];
  } catch (e) { return []; }
}

// 본문을 눌러 왼쪽으로 당기면 삭제/취소 버튼이 나타나는 스와이프 행.
// onNavigate가 없으면 탭해도 이동하지 않고(내부 입력칸이 정상적으로 반응), 스와이프로 열고 닫는 것만 동작한다.
function SwipeRow({ onNavigate, content, actions, actionWidth = 132, gap = 10, borderRadius = 12 }) {
  const [dragX, setDragX] = useState(0);
  const [open, setOpen] = useState(false);
  const info = useRef({ x: 0, y: 0, base: 0, active: null, dragged: false, lastX: 0 });

  const onTouchStart = (e) => {
    const t = e.touches[0];
    const tag = e.target && e.target.tagName;
    const isEditable = tag === "INPUT" || tag === "TEXTAREA";
    // 이미 포커스가 들어가 있어 "수정/선택 중"인 입력칸에서 시작된 드래그만 스와이프-삭제로
    // 인식하지 않는다(글자 선택/커서 이동 보호). 아직 선택(포커스)되지 않은 칸이면 평소처럼
    // 왼쪽으로 밀어서 삭제/취소를 열 수 있게 스와이프 판정을 그대로 살려둔다.
    const isBeingEdited = isEditable && document.activeElement === e.target;
    const startBase = open ? -actionWidth : 0;
    info.current = { x: t.clientX, y: t.clientY, base: startBase, active: isBeingEdited ? false : null, dragged: false, lastX: startBase };
  };
  const onTouchMove = (e) => {
    if (info.current.active === false) return;
    const t = e.touches[0];
    const dx = t.clientX - info.current.x;
    const dy = t.clientY - info.current.y;
    if (info.current.active === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      info.current.active = Math.abs(dx) > Math.abs(dy);
    }
    if (info.current.active) {
      info.current.dragged = true;
      let next = info.current.base + dx;
      next = Math.max(-actionWidth, Math.min(0, next));
      info.current.lastX = next;
      setDragX(next);
    }
  };
  const onTouchEnd = () => {
    if (info.current.active) {
      // React state(dragX)는 마지막 touchmove 이후 리렌더가 아직 안 끝났을 수 있어 값이 늦게
      // 반영될 수 있으므로, ref에 즉시 기록해둔 lastX를 기준으로 판정한다.
      const shouldOpen = info.current.lastX < -actionWidth / 2;
      setOpen(shouldOpen);
      setDragX(shouldOpen ? -actionWidth : 0);
    }
  };
  const close = () => { setOpen(false); setDragX(0); };
  const handleContentClick = () => {
    if (info.current.dragged) { info.current.dragged = false; return; }
    if (open) { close(); return; }
    if (onNavigate) onNavigate();
  };

  return (
    <div style={{ position: "relative", overflow: "hidden", borderRadius, marginBottom: gap }}>
      <div style={{ position: "absolute", top: 0, right: 0, bottom: 0, width: actionWidth, display: "flex" }}>
        {actions(close)}
      </div>
      <div
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        onClick={handleContentClick}
        style={{ transform: `translateX(${dragX}px)`, transition: info.current.active ? "none" : "transform 0.2s ease", touchAction: "pan-y", position: "relative", zIndex: 1, cursor: onNavigate ? "pointer" : "default", background: "#12151b" }}
      >
        {content}
      </div>
    </div>
  );
}

function BookQuotesView({ book, onBack, onUpdateBook, onRenameBook, onSnapshotUndo, undo, undoCount }) {
  const [newQuoteNumber, setNewQuoteNumber] = useState("");
  const [newQuoteText, setNewQuoteText] = useState("");
  const [quoteSearchQuery, setQuoteSearchQuery] = useState("");
  const quoteRowRefs = useRef({});
  const fileInputRef = useRef(null);

  const persistQuotes = (next) => onUpdateBook({ ...book, quotes: next });

  const renumberQuotes = (list) => [...list]
    .sort((a, b) => (num(a.number) || 0) - (num(b.number) || 0))
    .map((q, idx) => ({ ...q, number: idx + 1 }));

  const addQuote = () => {
    const text = newQuoteText.trim();
    if (!text) return;
    const maxNum = book.quotes.reduce((m, q) => Math.max(m, num(q.number) || 0), 0);
    const number = newQuoteNumber.trim() ? num(newQuoteNumber) : maxNum + 1;
    persistQuotes([...book.quotes, { id: genId(), number, text }]);
    setNewQuoteNumber("");
    setNewQuoteText("");
  };

  const updateQuoteNumber = (id, value) => {
    const parsed = Number(value);
    if (value.trim() === "" || !Number.isFinite(parsed)) {
      persistQuotes(book.quotes.map((q) => (q.id === id ? { ...q, number: value } : q)));
      return;
    }
    const targetNum = Math.max(parsed, book.learnedCount || 0);
    const editedItem = book.quotes.find((q) => q.id === id);
    const rest = book.quotes.filter((q) => q.id !== id).sort((a, b) => (num(a.number) || 0) - (num(b.number) || 0));
    const insertAt = Math.max(0, Math.min(rest.length, Math.round(targetNum) - 1));
    const reordered = [...rest.slice(0, insertAt), editedItem, ...rest.slice(insertAt)];
    persistQuotes(reordered.map((q, idx) => ({ ...q, number: idx + 1 })));
  };

  const updateQuoteText = (id, value) => {
    if (value.trim() === "") {
      onSnapshotUndo();
      persistQuotes(renumberQuotes(book.quotes.filter((q) => q.id !== id)));
      return;
    }
    persistQuotes(book.quotes.map((q) => (q.id === id ? { ...q, text: value } : q)));
  };

  const toggleBookmark = (id) => {
    onUpdateBook({ ...book, bookmarkQuoteId: book.bookmarkQuoteId === id ? null : id });
  };

  const jumpToBookmark = () => {
    const node = book.bookmarkQuoteId && quoteRowRefs.current[book.bookmarkQuoteId];
    if (node) node.scrollIntoView({ behavior: "smooth", block: "center" });
  };

  const setLearnedCount = (v) => {
    const n = Number(v);
    onUpdateBook({ ...book, learnedCount: Number.isFinite(n) && n >= 0 ? n : 0 });
  };

  const exportToExcel = () => {
    XLSX.writeFile(buildQuotesWorkbook(book.title, book.quotes), buildFileName(book.title));
  };

  const handleImportFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const wb = XLSX.read(evt.target.result, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        const imported = rows
          .map((row) => {
            const rawText = String(row["주요문"] ?? row["명언"] ?? row["내용"] ?? Object.values(row)[1] ?? "").trim();
            const { leadingNumber, text } = splitLeadingNumber(rawText);
            // 번호 열 값이 있으면 그걸 우선 쓰고, 없으면 본문 앞에 붙어 있던 숫자를 순서 참고용으로 쓴다.
            // 어느 쪽이든 최종 저장 시 전체를 1,2,3...으로 다시 매기므로 이 값 자체가 내용에 남지는 않는다.
            const numberRaw = row["번호"] ?? Object.values(row)[0];
            const number = num(numberRaw) || leadingNumber || 0;
            return { id: genId(), number, text };
          })
          .filter((q) => q.text);
        if (imported.length === 0) {
          alert("엑셀에서 읽을 수 있는 내용이 없어요. '번호'/'주요문' 열이 있는지 확인해주세요.");
          return;
        }
        // 기존 내용과 80% 이상 비슷하면 같은 내용으로 보고 제외한다. 가져오는 목록 안에서도 서로 비교해 중복은 하나만 남긴다.
        const acceptedTexts = book.quotes.map((q) => q.text);
        const uniqueImported = [];
        for (const q of imported) {
          if (isDuplicateText(q.text, acceptedTexts)) continue;
          acceptedTexts.push(q.text);
          uniqueImported.push(q);
        }
        const skipped = imported.length - uniqueImported.length;
        if (uniqueImported.length === 0) {
          alert("가져올 새 내용이 없어요 (전부 이미 있는 내용과 80% 이상 비슷해요).");
          return;
        }
        const merged = [...book.quotes, ...uniqueImported].sort((a, b) => (num(a.number) || 0) - (num(b.number) || 0));
        persistQuotes(merged.map((q, idx) => ({ ...q, number: idx + 1 })));
        alert(`${uniqueImported.length}개를 가져왔어요.${skipped > 0 ? ` (80% 이상 비슷한 내용 ${skipped}개 제외)` : ""}`);
      } catch (err) {
        alert("엑셀 파일을 읽지 못했어요: " + (err.message || err));
      }
    };
    reader.readAsArrayBuffer(file);
  };

  const [titleDraft, setTitleDraft] = useState(book.title || "");
  useEffect(() => { setTitleDraft(book.title || ""); }, [book.id]);

  const filteredQuotes = [...book.quotes]
    .filter((q) => {
      const query = quoteSearchQuery.trim().toLowerCase();
      if (!query) return true;
      return q.text.toLowerCase().includes(query) || String(q.number).includes(query);
    })
    .sort((a, b) => (num(a.number) || 0) - (num(b.number) || 0));

  return (
    <div style={{ padding: "calc(env(safe-area-inset-top, 0px) + 10px) 0 0" }}>
      <div style={{ padding: "0 10px 10px", position: "sticky", top: "env(safe-area-inset-top, 0px)", zIndex: 20, background: "#12151b", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6, flexWrap: "wrap" }}>
        <button onClick={onBack} className="iconbtn" style={{ color: "#c9974a", fontWeight: 700, fontSize: 14 }}>← 뒤로</button>
        <div style={{ display: "flex", gap: 6 }}>
          <input type="file" accept=".xlsx,.xls" ref={fileInputRef} onChange={handleImportFile} style={{ display: "none" }} />
          <button onClick={() => fileInputRef.current && fileInputRef.current.click()} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>⬆ 가져오기</button>
          <button onClick={exportToExcel} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>⬇ 내려받기</button>
          <button onClick={jumpToBookmark} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>📍 책갈피로</button>
          <button
            onClick={undo}
            disabled={undoCount === 0}
            className="iconbtn"
            style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: undoCount > 0 ? "#c9974a" : "#4a5060", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap", opacity: undoCount > 0 ? 1 : 0.5 }}
          >
            ↺{undoCount > 0 ? ` ${undoCount}` : ""}
          </button>
        </div>
      </div>
      <div style={{ padding: "0 8px 40px" }}>
        <div style={{ marginBottom: 16 }}>
          <input
            value={titleDraft}
            onChange={(e) => setTitleDraft(e.target.value)}
            onBlur={() => onRenameBook(titleDraft.trim() || "(제목 없음)")}
            placeholder="책 제목"

              <span style={{ fontSize: 12, color: "#8993a6" }}>번</span>
            </div>
          </div>
        </div>

        <div style={{ marginBottom: 24, paddingBottom: 20, borderBottom: "1px solid #262c37" }}>
          <div style={{ fontSize: 12.5, color: "#8993a6", marginBottom: 8 }}>새 주요문 추가 (번호를 안 넣으면 자동으로 다음 번호가 매겨져요)</div>
          <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
            <input
              value={newQuoteNumber}
              onChange={(e) => setNewQuoteNumber(e.target.value)}
              placeholder="번호"
              inputMode="numeric"
              className="field"
              style={{ width: 46, flexShrink: 0, fontSize: 16, textAlign: "center", padding: "6px 2px" }}

            <textarea
              value={newQuoteText}
              onChange={(e) => setNewQuoteText(e.target.value)}
              onBlur={addQuote}
              placeholder="내용을 입력하거나 붙여넣으세요"
              className="field"
              rows={3}
              style={{ flex: 1, fontSize: 17, color: "#e7eaf0", lineHeight: 1.6, resize: "vertical" }}

        <div style={{ fontSize: 12, color: "#5a6274", marginBottom: 10 }}>내용을 지워서 비우면 그 항목이 삭제되고 번호가 다시 매겨져요</div>

        <input
          value={quoteSearchQuery}
          onChange={(e) => setQuoteSearchQuery(e.target.value)}
          placeholder="🔍 주요문 검색 (번호 또는 내용)"
          className="field"
          style={{ marginBottom: 14, fontSize: 15, padding: "8px 10px" }}
        />

        {filteredQuotes.map((q) => (
          <div key={q.id} ref={(el) => { if (el) quoteRowRefs.current[q.id] = el; }}>
            <SwipeRow
              onNavigate={() => {}}
              actionWidth={112}
              content={
                <div style={{ display: "flex", gap: 6, alignItems: "flex-start", padding: "4px 6px", borderRadius: 8, background: q.id === book.bookmarkQuoteId ? "rgba(201,151,74,0.1)" : "transparent", boxSizing: "border-box" }}>
                  <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, flexShrink: 0 }}>
                    <input
                      value={q.number}
                      onChange={(e) => updateQuoteNumber(q.id, e.target.value)}
                      inputMode="numeric"
                      className="field"
                      style={{ width: 32, fontSize: 14, fontWeight: 700, color: "#c9974a", textAlign: "center", padding: "4px 0" }}
                    />
                    <input
                      type="checkbox"
                      checked={q.id === book.bookmarkQuoteId}
                      onChange={() => toggleBookmark(q.id)}
                      style={{ width: 16, height: 16, accentColor: "#c9974a", flexShrink: 0 }}
                    />
                  </div>
                  <textarea
                    ref={(el) => { if (el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; } }}
                    value={q.text}
                    onChange={(e) => {
                      updateQuoteText(q.id, e.target.value);
                      e.target.style.height = "auto";
                      e.target.style.height = e.target.scrollHeight + "px";
                    }}
                    className="field"
                    rows={1}
                    style={{ flex: 1, fontSize: 18, color: "#e7eaf0", lineHeight: 1.55, fontWeight: 600, resize: "none", overflow: "hidden", minHeight: 0, padding: "4px 8px" }}
                  />
                </div>
              }
              actions={(close) => (
                <>
                  <button
                    onClick={(e) => { e.stopPropagation(); close(); }}

                  >
                    취소
                  </button>
                  <button
                    onClick={(e) => { e.stopPropagation(); onSnapshotUndo(); persistQuotes(renumberQuotes(book.quotes.filter((x) => x.id !== q.id))); }}
                    style={{ flex: 1, border: "none", background: "#e8544b", color: "#fff", fontWeight: 700, fontSize: 12 }}
                  >
                    삭제
                  </button>
                </>

            />

        ))}

}

function SermonDetailView({ sermon, onBack, onUpdateSermon, preacherOptions, onSnapshotUndo, undo, undoCount }) {
  const [newQuoteNumber, setNewQuoteNumber] = useState("");
  const [newQuoteText, setNewQuoteText] = useState("");
  const [quoteSearchQuery, setQuoteSearchQuery] = useState("");
  const quoteRowRefs = useRef({});
  const fileInputRef = useRef(null);

  const persistQuotes = (next) => onUpdateSermon({ ...sermon, quotes: next });

  const renumberQuotes = (list) => [...list]
    .sort((a, b) => (num(a.number) || 0) - (num(b.number) || 0))
    .map((q, idx) => ({ ...q, number: idx + 1 }));

  const addQuote = () => {
    const text = newQuoteText.trim();
    if (!text) return;
    const maxNum = sermon.quotes.reduce((m, q) => Math.max(m, num(q.number) || 0), 0);
    const number = newQuoteNumber.trim() ? num(newQuoteNumber) : maxNum + 1;
    persistQuotes([...sermon.quotes, { id: genId(), number, text }]);
    setNewQuoteNumber("");
    setNewQuoteText("");
  };

  const updateQuoteNumber = (id, value) => {
    const parsed = Number(value);
    if (value.trim() === "" || !Number.isFinite(parsed)) {
      persistQuotes(sermon.quotes.map((q) => (q.id === id ? { ...q, number: value } : q)));
      return;
    }
    const targetNum = Math.max(parsed, sermon.learnedCount || 0);
    const editedItem = sermon.quotes.find((q) => q.id === id);
    const rest = sermon.quotes.filter((q) => q.id !== id).sort((a, b) => (num(a.number) || 0) - (num(b.number) || 0));
    const insertAt = Math.max(0, Math.min(rest.length, Math.round(targetNum) - 1));
    const reordered = [...rest.slice(0, insertAt), editedItem, ...rest.slice(insertAt)];
    persistQuotes(reordered.map((q, idx) => ({ ...q, number: idx + 1 })));
  };

  const updateQuoteText = (id, value) => {
    if (value.trim() === "") {
      onSnapshotUndo();
      persistQuotes(renumberQuotes(sermon.quotes.filter((q) => q.id !== id)));
      return;
    }
    persistQuotes(sermon.quotes.map((q) => (q.id === id ? { ...q, text: value } : q)));
  };

  const toggleBookmark = (id) => {
    onUpdateSermon({ ...sermon, bookmarkQuoteId: sermon.bookmarkQuoteId === id ? null : id });
  };

  const jumpToBookmark = () => {
    const node = sermon.bookmarkQuoteId && quoteRowRefs.current[sermon.bookmarkQuoteId];
    if (node) node.scrollIntoView({ behavior: "smooth", block: "center" });
  };

  const setLearnedCount = (v) => {
    const n = Number(v);
    onUpdateSermon({ ...sermon, learnedCount: Number.isFinite(n) && n >= 0 ? n : 0 });
  };

  const fileBaseName = () => sermon.title && sermon.title.trim() ? sermon.title : sermon.date;

  const exportToExcel = () => {
    XLSX.writeFile(buildQuotesWorkbook(fileBaseName(), sermon.quotes), buildFileName(fileBaseName()));
  };

  const handleImportFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const wb = XLSX.read(evt.target.result, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];

        // 한 열에 "2026년9월6일 / 제목 : ... / 성경 : ... / 강사 : ... / 1. 내용 / 2. 내용 ..." 처럼
        // 줄 단위로 정리된 설교 노트 형식인지 먼저 확인한다.
        const raw2d = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        const firstCells = raw2d.slice(0, 8).map((r) => String((r && r[0]) ?? "").trim());
        const looksLikeSermonNote =
          firstCells.some((c) => /^제목\s*[:：]/.test(c)) ||
          firstCells.some((c) => /^성경\s*[:：]/.test(c)) ||
          firstCells.some((c) => /^강사\s*[:：]/.test(c));

        let imported = [];
        let fieldUpdates = null;

        if (looksLikeSermonNote) {
          let title = null, scripture = null, preacher = null, dateStr = null;
          const contentLines = [];
          for (const r of raw2d) {
            const cell = String((r && r[0]) ?? "");
            const trimmed = cell.trim();
            if (!trimmed) continue;
            let m;
            if ((m = trimmed.match(/^제목\s*[:：]\s*(.*)$/))) { title = m[1].trim(); continue; }
            if ((m = trimmed.match(/^성경\s*[:：]\s*(.*)$/))) { scripture = m[1].trim(); continue; }
            if ((m = trimmed.match(/^강사\s*[:：]\s*(.*)$/))) { preacher = m[1].trim(); continue; }
            if ((m = trimmed.match(/^(\d{4})[년.\-\/](\d{1,2})[월.\-\/](\d{1,2})\s*일?$/))) {
              dateStr = `${m[1]}-${pad2(Number(m[2]))}-${pad2(Number(m[3]))}`;
              continue;
            }
            const normalized = cell.replace(/\t/g, " ").replace(/\s+/g, " ").trim();
            if (normalized) contentLines.push(normalized);
          }
          imported = contentLines
            .map((line) => {
              const { text } = splitLeadingNumber(line);
              return { id: genId(), number: 0, text };
            })
            .filter((q) => q.text)
            .map((q, idx) => ({ ...q, number: idx + 1 }));
          fieldUpdates = {};
          if (dateStr) fieldUpdates.date = dateStr;
          if (title) fieldUpdates.title = title;
          if (scripture) fieldUpdates.scripture = scripture;
          if (preacher) fieldUpdates.preacher = preacher;
        } else {
          const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
          imported = rows
            .map((row) => {
              const rawText = String(row["주요문"] ?? row["명언"] ?? row["내용"] ?? Object.values(row)[1] ?? "").trim();
              const { leadingNumber, text } = splitLeadingNumber(rawText);
              const numberRaw = row["번호"] ?? Object.values(row)[0];
              const number = num(numberRaw) || leadingNumber || 0;
              return { id: genId(), number, text };
            })
            .filter((q) => q.text);
        }

        if (imported.length === 0) {
          alert("엑셀에서 읽을 수 있는 내용이 없어요.");
          return;
        }
        const acceptedTexts = sermon.quotes.map((q) => q.text);
        const uniqueImported = [];
        for (const q of imported) {
          if (isDuplicateText(q.text, acceptedTexts)) continue;
          acceptedTexts.push(q.text);
          uniqueImported.push(q);
        }
        const skipped = imported.length - uniqueImported.length;
        if (uniqueImported.length === 0 && !fieldUpdates) {
          alert("가져올 새 내용이 없어요 (전부 이미 있는 내용과 80% 이상 비슷해요).");
          return;
        }
        const merged = [...sermon.quotes, ...uniqueImported].sort((a, b) => (num(a.number) || 0) - (num(b.number) || 0));
        const renumbered = merged.map((q, idx) => ({ ...q, number: idx + 1 }));
        onUpdateSermon({ ...sermon, ...(fieldUpdates || {}), quotes: renumbered });
        alert(`${uniqueImported.length}개를 가져왔어요.${skipped > 0 ? ` (80% 이상 비슷한 내용 ${skipped}개 제외)` : ""}${fieldUpdates ? " 날짜/제목/성경/강사도 함께 채웠어요." : ""}`);
      } catch (err) {
        alert("엑셀 파일을 읽지 못했어요: " + (err.message || err));
      }
    };
    reader.readAsArrayBuffer(file);
  };

  const filteredQuotes = [...sermon.quotes]
    .filter((q) => {
      const query = quoteSearchQuery.trim().toLowerCase();
      if (!query) return true;
      return q.text.toLowerCase().includes(query) || String(q.number).includes(query);
    })
    .sort((a, b) => (num(a.number) || 0) - (num(b.number) || 0));

  return (
    <div style={{ padding: "calc(env(safe-area-inset-top, 0px) + 10px) 0 0" }}>
      <div style={{ padding: "0 10px 10px", position: "sticky", top: "env(safe-area-inset-top, 0px)", zIndex: 20, background: "#12151b", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6, flexWrap: "wrap" }}>
        <button onClick={onBack} className="iconbtn" style={{ color: "#c9974a", fontWeight: 700, fontSize: 14 }}>← 뒤로</button>
        <div style={{ display: "flex", gap: 6 }}>
          <input type="file" accept=".xlsx,.xls" ref={fileInputRef} onChange={handleImportFile} style={{ display: "none" }} />
          <button onClick={() => fileInputRef.current && fileInputRef.current.click()} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>⬆ 가져오기</button>
          <button onClick={exportToExcel} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>⬇ 내려받기</button>
          <button onClick={jumpToBookmark} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>📍 책갈피로</button>
          <button
            onClick={undo}
            disabled={undoCount === 0}
            className="iconbtn"
            style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: undoCount > 0 ? "#c9974a" : "#4a5060", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap", opacity: undoCount > 0 ? 1 : 0.5 }}
          >
            ↺{undoCount > 0 ? ` ${undoCount}` : ""}
          </button>
        </div>
      </div>
      <div style={{ padding: "0 8px 40px" }}>
        <div style={{ marginBottom: 16, display: "flex", flexDirection: "column", gap: 10 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 17, fontWeight: 700, color: "#8993a6", flexShrink: 0, width: 40 }}>날짜</span>
            <input
              type="date"
              value={sermon.date}
              onChange={(e) => onUpdateSermon({ ...sermon, date: e.target.value })}
              className="field"
              style={{ width: "33%", flexShrink: 0, fontSize: 18, fontWeight: 700, color: "#c9974a", padding: "9px 10px" }}
            />
            <input
              value={quoteSearchQuery}
              onChange={(e) => setQuoteSearchQuery(e.target.value)}
              placeholder="🔍 주요문 검색"
              className="field"
              style={{ flex: 1, minWidth: 0, fontSize: 16, padding: "9px 10px" }}
            />
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 17, fontWeight: 700, color: "#8993a6", flexShrink: 0, width: 40 }}>제목</span>
            <input
              value={sermon.title}
              onChange={(e) => onUpdateSermon({ ...sermon, title: e.target.value })}
              placeholder="설교 제목"
              className="field"
              style={{ flex: 1, minWidth: 0, fontSize: 19, fontWeight: 800, color: "#e7eaf0", padding: "9px 10px" }}
            />
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 17, fontWeight: 700, color: "#8993a6", flexShrink: 0, width: 40 }}>성경</span>
            <input
              value={sermon.scripture}
              onChange={(e) => onUpdateSermon({ ...sermon, scripture: e.target.value })}
              placeholder="예: 요한복음 3장 16절"
              className="field"
              style={{ flex: 1, minWidth: 0, fontSize: 18, color: "#e7eaf0", padding: "9px 10px" }}
            />
            <a
              href="https://apps.apple.com/kr/app/id488089999"
              target="_blank"
              rel="noopener noreferrer"
              title="바이블 애플에서 보기"
              style={{ display: "flex", alignItems: "center", justifyContent: "center", width: 36, height: 36, borderRadius: 10, background: "#ffffff", flexShrink: 0, textDecoration: "none", fontSize: 19, boxShadow: "0 1px 3px rgba(0,0,0,0.3)" }}
            >
              🍎
            </a>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 17, fontWeight: 700, color: "#8993a6", flexShrink: 0, width: 40 }}>강사</span>
            <input
              value={sermon.preacher}
              onChange={(e) => onUpdateSermon({ ...sermon, preacher: e.target.value })}
              placeholder={DEFAULT_PREACHER}
              list="preacher-options"
              className="field"
              style={{ flex: 1, minWidth: 0, fontSize: 18, color: "#e7eaf0", padding: "9px 10px" }}
            />
            <datalist id="preacher-options">
              {preacherOptions.map((p) => <option key={p} value={p} />)}
            </datalist>
          </div>
          <div style={{ display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 4 }}>
            <span style={{ fontSize: 13, color: "#8993a6" }}>익힘</span>
            <input
              value={sermon.learnedCount || 0}
              onChange={(e) => setLearnedCount(e.target.value)}
              inputMode="numeric"
              className="field"
              style={{ width: 44, fontSize: 15, fontWeight: 700, color: "#c9974a", textAlign: "center", padding: "5px 2px" }}
            />
            <span style={{ fontSize: 13, color: "#8993a6" }}>번</span>
          </div>
        </div>

        <div style={{ marginBottom: 24, paddingBottom: 20, borderBottom: "1px solid #262c37" }}>
          <div style={{ fontSize: 13.5, color: "#8993a6", marginBottom: 8 }}>새 주요문 추가 (번호를 안 넣으면 자동으로 다음 번호가 매겨져요)</div>
          <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
            <input
              value={newQuoteNumber}
              onChange={(e) => setNewQuoteNumber(e.target.value)}
              placeholder="번호"
              inputMode="numeric"
              className="field"
              style={{ width: 48, flexShrink: 0, fontSize: 17, textAlign: "center", padding: "6px 2px" }}
            />
            <textarea
              value={newQuoteText}
              onChange={(e) => setNewQuoteText(e.target.value)}
              onBlur={addQuote}
              placeholder="내용을 입력하거나 붙여넣으세요"
              className="field"
              rows={3}
              style={{ flex: 1, fontSize: 18, color: "#e7eaf0", lineHeight: 1.6, resize: "vertical" }}
            />
          </div>
        </div>

        <div style={{ fontSize: 13, color: "#5a6274", marginBottom: 10 }}>내용을 지워서 비우면 그 항목이 삭제되고 번호가 다시 매겨져요</div>

        {filteredQuotes.map((q) => (
          <div key={q.id} ref={(el) => { if (el) quoteRowRefs.current[q.id] = el; }}>
            <SwipeRow
              onNavigate={() => {}}
              actionWidth={112}
              content={
                <div style={{ display: "flex", gap: 6, alignItems: "flex-start", padding: "4px 8px", borderRadius: 8, background: q.id === sermon.bookmarkQuoteId ? "rgba(201,151,74,0.1)" : "transparent", boxSizing: "border-box" }}>
                  <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, flexShrink: 0 }}>
                    <input
                      value={q.number}
                      onChange={(e) => updateQuoteNumber(q.id, e.target.value)}
                      inputMode="numeric"
                      className="field"
                      style={{ width: 34, fontSize: 16, fontWeight: 700, color: "#c9974a", textAlign: "center", padding: "4px 0" }}
                    />
                    <input
                      type="checkbox"
                      checked={q.id === sermon.bookmarkQuoteId}
                      onChange={() => toggleBookmark(q.id)}
                      style={{ width: 16, height: 16, accentColor: "#c9974a", flexShrink: 0 }}
                    />
                  </div>
                  <textarea
                    ref={(el) => { if (el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; } }}
                    value={q.text}
                    onChange={(e) => {
                      updateQuoteText(q.id, e.target.value);
                      e.target.style.height = "auto";
                      e.target.style.height = e.target.scrollHeight + "px";
                    }}
                    className="field"
                    rows={1}
                    style={{ flex: 1, fontSize: 18, color: "#e7eaf0", lineHeight: 1.55, fontWeight: 600, resize: "none", overflow: "hidden", minHeight: 0, padding: "4px 8px" }}
                  />
                </div>
              }
              actions={(close) => (
                <>
                  <button
                    onClick={(e) => { e.stopPropagation(); close(); }}
                    style={{ flex: 1, border: "none", background: "#3a4150", color: "#e7eaf0", fontWeight: 700, fontSize: 12 }}
                  >
                    취소
                  </button>
                  <button
                    onClick={(e) => { e.stopPropagation(); onSnapshotUndo(); persistQuotes(renumberQuotes(sermon.quotes.filter((x) => x.id !== q.id))); }}
                    style={{ flex: 1, border: "none", background: "#e8544b", color: "#fff", fontWeight: 700, fontSize: 12 }}
                  >
                    삭제
                  </button>
                </>
              )}
            />
          </div>
        ))}
      </div>
    </div>
  );
}

function SermonListView({ sermons, onOpenSermon, onDeleteSermon, newSermonDate, onChangeNewSermonDate, onAddSermon, onBackToReading, undo, undoCount }) {
  const sorted = [...sermons].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0)); // 최근 날짜가 먼저

  const fmtDate = (ds) => {
    if (!ds) return ds;
    const d = parseLocalDate(ds);
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    return `${ds} (${days[d.getDay()]})`;
  };

  return (
    <div style={{ padding: "calc(env(safe-area-inset-top, 0px) + 22px) 16px 20px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
        <button onClick={onBackToReading} className="iconbtn" style={{ color: "#c9974a", fontWeight: 700, fontSize: 13 }}>← 홈으로</button>
        <button
          onClick={undo}
          disabled={undoCount === 0}
          className="iconbtn"
          style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: undoCount > 0 ? "#c9974a" : "#4a5060", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap", opacity: undoCount > 0 ? 1 : 0.5 }}
        >
          ↺ 실행취소{undoCount > 0 ? ` (${undoCount})` : ""}
        </button>
      </div>
      <div style={{ fontSize: 33, fontWeight: 800, marginBottom: 4 }}>⛪ 교회설교요약</div>
      <div style={{ fontSize: 12, color: "#8993a6", marginBottom: 18 }}>
        매주 일요일 날짜가 자동으로 추가돼요(앱을 열 때 그 사이 빠진 주를 채워 넣어요). 필요하면 날짜를 직접 추가할 수도 있어요. 박스를 왼쪽으로 밀면 삭제/취소를 선택할 수 있어요.
      </div>

      {sorted.length === 0 && (
        <div style={{ textAlign: "center", color: "#8993a6", fontSize: 13, padding: "40px 0" }}>아직 등록된 설교가 없어요.</div>
      )}

      {sorted.map((s) => (
        <SwipeRow
          key={s.id}
          onNavigate={() => onOpenSermon(s.id)}
          content={
            <div style={{ background: "#1a1f28", border: "1px solid #262c37", borderRadius: 12, padding: "14px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 13, color: "#c9974a", fontWeight: 700 }}>{fmtDate(s.date)}</div>
                <div style={{ fontSize: 19, fontWeight: 700, color: "#e7eaf0", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", marginTop: 2 }}>
                  {s.title && s.title.trim() ? s.title : "(제목 없음)"}
                </div>
                <div style={{ fontSize: 12, color: "#8993a6", marginTop: 4 }}>
                  {s.scripture ? `${s.scripture} · ` : ""}{s.preacher || DEFAULT_PREACHER} · 주요문 {s.quotes.length}개
                </div>
              </div>
              <div style={{ color: "#8993a6", fontSize: 18, flexShrink: 0 }}>›</div>
            </div>
          }
          actions={(close) => (
            <>
              <button
                onClick={(e) => { e.stopPropagation(); close(); }}
                style={{ flex: 1, border: "none", background: "#3a4150", color: "#e7eaf0", fontWeight: 700, fontSize: 13 }}
              >
                취소
              </button>
              <button
                onClick={(e) => { e.stopPropagation(); onDeleteSermon(s.id); }}
                style={{ flex: 1, border: "none", background: "#e8544b", color: "#fff", fontWeight: 700, fontSize: 13 }}
              >
                삭제
              </button>
            </>
          )}
        />
      ))}

      <div style={{ marginTop: 6 }}>
        <div style={{ fontSize: 12, color: "#8993a6", marginBottom: 8 }}>날짜를 직접 추가하기</div>
        <div style={{ display: "flex", gap: 8 }}>
          <input
            type="date"
            value={newSermonDate}
            onChange={(e) => onChangeNewSermonDate(e.target.value)}
            className="field"
            style={{ flex: 1, fontSize: 14, padding: "10px 12px" }}
          />
          <button
            onClick={onAddSermon}
            className="iconbtn"
            style={{ border: "1px solid #c9974a", background: "rgba(201,151,74,0.12)", color: "#c9974a", fontWeight: 700, fontSize: 13, borderRadius: 10, padding: "0 16px", whiteSpace: "nowrap" }}
          >
            + 추가
          </button>
        </div>
      </div>
    </div>
  );
}

// 5분간 움직임이 없을 때 화면을 덮는 오버레이. 탭하면 다시 켜진다.
function ScreenOffOverlay({ onWake }) {
  return (
    <div
      onClick={onWake}
      onTouchStart={onWake}
      style={{ position: "fixed", inset: 0, background: "#000", zIndex: 9999 }}
    />
  );
}

function App() {
  const [books, setBooks] = useState(loadBooks);
  const [mainView, setMainView] = useState("index"); // 'index' | 'book'
  const [currentBookId, setCurrentBookId] = useState(null);

  const [mainSection, setMainSection] = useState("home"); // 'home' | 'reading' | 'sermon'
  const [sermons, setSermons] = useState(() => ensureSundays(loadRawSermons(), new Set(loadDeletedSermonDates())));
  const [deletedSermonDates, setDeletedSermonDates] = useState(loadDeletedSermonDates);
  const [sermonView, setSermonView] = useState("list"); // 'list' | 'detail'
  const [currentSermonId, setCurrentSermonId] = useState(null);
  const [newSermonDate, setNewSermonDate] = useState("");

  useEffect(() => {
    try { localStorage.setItem(BOOKS_KEY, JSON.stringify(books)); } catch (e) {}
  }, [books]);

  useEffect(() => {
    try { localStorage.setItem(SERMONS_KEY, JSON.stringify(sermons)); } catch (e) {}
  }, [sermons]);

  useEffect(() => {
    try { localStorage.setItem(DELETED_SERMON_DATES_KEY, JSON.stringify(deletedSermonDates)); } catch (e) {}
  }, [deletedSermonDates]);

  // 실수로 삭제했을 때 되돌리기 위한 실행취소 스택 (최근 5단계).
  const undoStackRef = useRef([]);
  const [undoCount, setUndoCount] = useState(0);
  const pushUndoSnapshot = () => {
    undoStackRef.current = [
      ...undoStackRef.current,
      {
        books: JSON.parse(JSON.stringify(books)),
        sermons: JSON.parse(JSON.stringify(sermons)),
        deletedSermonDates: [...deletedSermonDates],
      },
    ].slice(-5);
    setUndoCount(undoStackRef.current.length);
  };
  const undo = () => {
    const stack = undoStackRef.current;
    if (stack.length === 0) return;
    const last = stack[stack.length - 1];
    undoStackRef.current = stack.slice(0, -1);
    setBooks(last.books);
    setSermons(last.sermons);
    setDeletedSermonDates(last.deletedSermonDates || []);
    setUndoCount(undoStackRef.current.length);
  };

  // 화면을 열어두고 5분간 움직임(터치/입력 등)이 없으면 화면을 어둡게 꺼서 보여준다.
  // (웹앱은 기기의 실제 화면 밝기/잠금을 직접 끌 수는 없어서, 앱 내용을 검게 가려 "꺼진 것처럼" 만든다.
  //  아무 곳이나 다시 터치하면 켜진다.)
  const [screenOff, setScreenOff] = useState(false);
  useEffect(() => {
    const IDLE_MS = 5 * 60 * 1000;
    let timer = null;
    const resetTimer = () => {
      setScreenOff(false);
      if (timer) clearTimeout(timer);
      timer = setTimeout(() => setScreenOff(true), IDLE_MS);
    };
    const events = ["touchstart", "touchmove", "mousedown", "mousemove", "keydown", "scroll"];
    events.forEach((ev) => window.addEventListener(ev, resetTimer, { passive: true }));
    resetTimer();
    return () => {
      events.forEach((ev) => window.removeEventListener(ev, resetTimer));
      if (timer) clearTimeout(timer);
    };
  }, []);

  const currentBook = books.find((b) => b.id === currentBookId) || null;
  const currentSermon = sermons.find((s) => s.id === currentSermonId) || null;
  const preacherOptions = Array.from(new Set([DEFAULT_PREACHER, ...sermons.map((s) => s.preacher).filter(Boolean)]));

  const updateBook = (nextBook) => {
    setBooks((prev) => prev.map((b) => (b.id === nextBook.id ? nextBook : b)));
  };
  const renameBook = (title) => {
    if (!currentBook) return;
    updateBook({ ...currentBook, title });
  };

  const updateSermon = (nextSermon) => {
    setSermons((prev) => prev.map((s) => (s.id === nextSermon.id ? nextSermon : s)));
  };
  const addSermon = () => {
    if (!newSermonDate) return;
    if (sermons.some((s) => s.date === newSermonDate)) {
      alert("이미 그 날짜의 설교가 있어요.");
      return;
    }
    const lastPreacher = sermons.length
      ? sermons.reduce((latest, s) => (s.date > latest.date ? s : latest), sermons[0]).preacher
      : DEFAULT_PREACHER;
    const s = makeSermon(newSermonDate, lastPreacher);
    setSermons((prev) => [...prev, s]);
    setDeletedSermonDates((prev) => prev.filter((d) => d !== newSermonDate));
    setNewSermonDate("");
    setCurrentSermonId(s.id);
    setSermonView("detail");
  };
  const deleteSermon = (id) => {
    pushUndoSnapshot();
    const target = sermons.find((s) => s.id === id);
    if (target) {
      setDeletedSermonDates((prev) => (prev.includes(target.date) ? prev : [...prev, target.date]));
    }
    setSermons((prev) => prev.filter((s) => s.id !== id));
  };

  const [newBookTitle, setNewBookTitle] = useState("");
  const addBook = () => {
    const trimmed = newBookTitle.trim();
    if (!trimmed) return;
    const book = { id: genId(), title: trimmed, learnedCount: 0, bookmarkQuoteId: null, readDate: new Date().toISOString().slice(0, 10), quotes: [] };
    setBooks((prev) => [...prev, book]);
    setNewBookTitle("");
    setCurrentBookId(book.id);
    setMainView("book");
  };

  const deleteBook = (id) => {
    pushUndoSnapshot();
    setBooks((prev) => prev.filter((b) => b.id !== id));
  };

  if (mainSection === "home") {
    return (
      <div style={{ minHeight: "100vh", maxWidth: 520, margin: "0 auto", color: "#e7eaf0", fontFamily: "'Pretendard','Apple SD Gothic Neo',sans-serif" }}>
        {screenOff && <ScreenOffOverlay onWake={() => setScreenOff(false)} />}
        <style>{`
          .field { background:#12151b; border:1px solid #2a303c; border-radius:8px; color:#e7eaf0; padding:6px 8px; font-size:13px; width:100%; }
          .field:focus { outline:none; border-color:#c9974a; }
          .iconbtn { background:none; border:none; cursor:pointer; }
        `}</style>
        <div style={{ padding: "calc(env(safe-area-inset-top, 0px) + 22px) 16px 20px" }}>
          <div style={{ fontSize: 54, fontWeight: 800, marginBottom: 4 }}>📚 독서요약집</div>
          <div style={{ fontSize: 12, color: "#8993a6", marginBottom: 18 }}>아래에서 메뉴를 선택하세요.</div>

          <div
            onClick={() => { setMainSection("reading"); setMainView("index"); }}
            style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, background: "#1a1f28", border: "1px solid #262c37", borderRadius: 12, padding: "16px 16px", marginBottom: 10, cursor: "pointer" }}
          >
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 30 }}>📖</span>
              <div>
                <div style={{ fontSize: 26, fontWeight: 700, color: "#e7eaf0" }}>독서완료</div>
                <div style={{ fontSize: 12, color: "#8993a6", marginTop: 2 }}>{books.length}권의 책</div>
              </div>
            </div>
            <div style={{ color: "#8993a6", fontSize: 18 }}>›</div>
          </div>

          <div
            onClick={() => setMainSection("sermon")}
            style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, background: "#1a1f28", border: "1px solid #262c37", borderRadius: 12, padding: "16px 16px", cursor: "pointer" }}
          >
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 30 }}>⛪</span>
              <div>
                <div style={{ fontSize: 26, fontWeight: 700, color: "#e7eaf0" }}>교회설교요약</div>
                <div style={{ fontSize: 12, color: "#8993a6", marginTop: 2 }}>{sermons.length}개의 주일 설교</div>
              </div>
            </div>
            <div style={{ color: "#8993a6", fontSize: 18 }}>›</div>
          </div>
        </div>
      </div>
    );
  }

  if (mainSection === "sermon") {
    return (
      <div style={{ minHeight: "100vh", maxWidth: 520, margin: "0 auto", color: "#e7eaf0", fontFamily: "'Pretendard','Apple SD Gothic Neo',sans-serif" }}>
        {screenOff && <ScreenOffOverlay onWake={() => setScreenOff(false)} />}
        <style>{`
          .field { background:#12151b; border:1px solid #2a303c; border-radius:8px; color:#e7eaf0; padding:6px 8px; font-size:13px; width:100%; }
          .field:focus { outline:none; border-color:#c9974a; }
          .iconbtn { background:none; border:none; cursor:pointer; }
        `}</style>
        {sermonView === "list" && (
          <SermonListView
            sermons={sermons}
            onOpenSermon={(id) => { setCurrentSermonId(id); setSermonView("detail"); }}
            onAddSermon={addSermon}
            onDeleteSermon={deleteSermon}
            newSermonDate={newSermonDate}
            onChangeNewSermonDate={setNewSermonDate}
            onBackToReading={() => setMainSection("home")}
            undo={undo}
            undoCount={undoCount}
          />
        )}
        {sermonView === "detail" && currentSermon && (
          <SermonDetailView
            sermon={currentSermon}
            onBack={() => setSermonView("list")}
            onUpdateSermon={updateSermon}
            preacherOptions={preacherOptions}
            onSnapshotUndo={pushUndoSnapshot}
            undo={undo}
            undoCount={undoCount}
          />
        )}
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", maxWidth: 520, margin: "0 auto", color: "#e7eaf0", fontFamily: "'Pretendard','Apple SD Gothic Neo',sans-serif" }}>
      {screenOff && <ScreenOffOverlay onWake={() => setScreenOff(false)} />}
      <style>{`
        .field { background:#12151b; border:1px solid #2a303c; border-radius:8px; color:#e7eaf0; padding:6px 8px; font-size:13px; width:100%; }
        .field:focus { outline:none; border-color:#c9974a; }
        .iconbtn { background:none; border:none; cursor:pointer; }
      `}</style>

      {mainView === "index" && (
        <div style={{ padding: "calc(env(safe-area-inset-top, 0px) + 22px) 16px 20px" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
            <button onClick={() => setMainSection("home")} className="iconbtn" style={{ color: "#c9974a", fontWeight: 700, fontSize: 13 }}>← 홈으로</button>
            <button
              onClick={undo}
              disabled={undoCount === 0}
              className="iconbtn"
              style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: undoCount > 0 ? "#c9974a" : "#4a5060", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap", opacity: undoCount > 0 ? 1 : 0.5 }}
            >
              ↺ 실행취소{undoCount > 0 ? ` (${undoCount})` : ""}
            </button>
          </div>
          <div style={{ fontSize: 41, fontWeight: 800, marginBottom: 4 }}>📖 독서완료</div>
          <div style={{ fontSize: 12, color: "#8993a6", marginBottom: 18 }}>책을 눌러 주요문/요약을 보고, 아래에서 새 책을 추가하세요. 박스를 왼쪽으로 밀면 삭제/취소를 선택할 수 있어요.</div>

          {books.length === 0 && (
            <div style={{ textAlign: "center", color: "#8993a6", fontSize: 13, padding: "40px 0" }}>아직 등록된 책이 없어요.</div>
          )}

          {[...books]
            .sort((a, b) => {
              const da = a.readDate || "";
              const db = b.readDate || "";
              if (!da && !db) return 0;
              if (!da) return 1;
              if (!db) return -1;
              return db.localeCompare(da); // 최근에 읽은 책이 먼저
            })
            .map((b) => (
            <SwipeRow
              key={b.id}
              onNavigate={() => { setCurrentBookId(b.id); setMainView("book"); }}
              content={
                <div style={{ background: "#1a1f28", border: "1px solid #262c37", borderRadius: 12, padding: "14px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontSize: 19, fontWeight: 700, color: "#e7eaf0", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{b.title || "(제목 없음)"}</div>
                    <div style={{ fontSize: 12, color: "#8993a6", marginTop: 4 }}>
                      주요문 {b.quotes.length}개 · 읽은날짜 {b.readDate || "미설정"} · 익힘 {b.learnedCount || 0}번
                    </div>
                  </div>
                  <div style={{ color: "#8993a6", fontSize: 18, flexShrink: 0 }}>›</div>
                </div>
              }
              actions={(close) => (
                <>
                  <button
                    onClick={(e) => { e.stopPropagation(); close(); }}
                    style={{ flex: 1, border: "none", background: "#3a4150", color: "#e7eaf0", fontWeight: 700, fontSize: 13 }}
                  >
                    취소
                  </button>
                  <button
                    onClick={(e) => { e.stopPropagation(); deleteBook(b.id); }}
                    style={{ flex: 1, border: "none", background: "#e8544b", color: "#fff", fontWeight: 700, fontSize: 13 }}
                  >
                    삭제
                  </button>
                </>
              )}
            />
          ))}

          <div style={{ marginTop: 6 }}>
            <div style={{ fontSize: 12, color: "#8993a6", marginBottom: 8 }}>새 책 제목을 입력하고 추가하세요</div>
            <div style={{ display: "flex", gap: 8 }}>
              <input
                value={newBookTitle}
                onChange={(e) => setNewBookTitle(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") addBook(); }}
                placeholder="새 책 제목 (예: 투자명언)"
                className="field"
                style={{ flex: 1, fontSize: 14, padding: "10px 12px" }}
              />
              <button
                onClick={addBook}
                className="iconbtn"
                style={{ border: "1px solid #c9974a", background: "rgba(201,151,74,0.12)", color: "#c9974a", fontWeight: 700, fontSize: 13, borderRadius: 10, padding: "0 16px", whiteSpace: "nowrap" }}
              >
                + 추가
              </button>
            </div>
          </div>
        </div>
      )}

      {mainView === "book" && currentBook && (
        <BookQuotesView
          book={currentBook}
          onBack={() => setMainView("index")}
          onUpdateBook={updateBook}
          onRenameBook={renameBook}
          onSnapshotUndo={pushUndoSnapshot}
          undo={undo}
          undoCount={undoCount}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
