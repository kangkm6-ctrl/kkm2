              <button onClick={() => { setChartTab("psr"); setFundSelected(null); }} className="iconbtn" style={{ flex: 1, padding: "6px 0", borderRadius: 8, border: chartTab === "psr" ? "1px solid #c9974a" : "1px solid #262c37", background: chartTab === "psr" ? "rgba(201,151,74,0.15)" : "#1a1f28", color: chartTab === "psr" ? "#c9974a" : "#8993a6", fontWeight: 700, fontSize: 12 }}>PSR</button>
              <button onClick={() => { setChartTab("roe"); setFundSelected(null); }} className="iconbtn" style={{ flex: 1, padding: "6px 0", borderRadius: 8, border: chartTab === "roe" ? "1px solid #c9974a" : "1px solid #262c37", background: chartTab === "roe" ? "rgba(201,151,74,0.15)" : "#1a1f28", color: chartTab === "roe" ? "#c9974a" : "#8993a6", fontWeight: 700, fontSize: 12 }}>ROE·성장률</button>
              <button onClick={() => { setChartTab("eva"); setFundSelected(null); }} className="iconbtn" style={{ flex: 1, padding: "6px 0", borderRadius: 8, border: chartTab === "eva" ? "1px solid #c9974a" : "1px solid #262c37", background: chartTab === "eva" ? "rgba(201,151,74,0.15)" : "#1a1f28", color: chartTab === "eva" ? "#c9974a" : "#8993a6", fontWeight: 700, fontSize: 12 }}>EVA</button>
            </div>
            <div style={{ padding: "0 16px 20px" }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: "#e7eaf0", marginBottom: 4 }}>ROE·매출액성장률</div>
              <div style={{ fontSize: 10, color: "#5a6274", marginBottom: 10 }}>
                한투 API 재무비율 기준 ROE(자기자본이익률)와 매출액성장률을 함께 봐요. 연도 표시는 위에 한 번만, 값은 ROE·성장 두 줄로 나오고 각각 옆에 우수 기준이 표시돼요. 전년 대비 상승(붉은색)·하락(파란색)으로 색이 매겨지고, 우수 기준을 만족하면 <span style={{ border: "1px solid #e8544b", padding: "0 3px", borderRadius: 3 }}>테두리</span>가 추가돼요. 우선주는 본주 재무데이터를 사용해요. 탭하면 분기별로 최대한 길게(5년 이상) 겹친 추이 차트가 나와요.
              </div>
              {fundamentalsLoading && <div style={{ color: "#8993a6", fontSize: 12, textAlign: "center", padding: 16 }}>불러오는 중...</div>}
              {fundamentalsMsg && <div style={{ color: "#8993a6", fontSize: 11, marginBottom: 8 }}>{fundamentalsMsg}</div>}
              {!fundamentalsLoading && styled.length === 0 && (
                <div style={{ color: "#5a6274", fontSize: 12, textAlign: "center", padding: 20 }}>표시할 데이터가 없어요.</div>
              )}
              {styled.map((r, i) => {
                const isSel = fundSelected === r.code;
                const years = sharedYears(r.roeAnnual, r.growthAnnual);
                return (
                  <React.Fragment key={r.code}>
                    <button
                      type="button"
                      onClick={() => setFundSelected((cur) => (cur === r.code ? null : r.code))}
                      style={{
                        width: "100%", padding: "5px 6px", fontSize: 12,
                        border: isSel ? `1px solid ${r.color}` : "1px solid transparent",
                        background: isSel ? "rgba(255,255,255,0.06)" : "none",
                        borderRadius: 6,
                      }}
                    >
                      <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                        <span style={{ color: "#5a6274", minWidth: 14, textAlign: "right", flexShrink: 0, fontSize: 11 }}>{i + 1}</span>
                        <span style={{ width: 10, height: r.width >= 2 ? 4 : 2, background: r.color, borderRadius: 2, flexShrink: 0 }} />
                        <span style={{ color: "#e7eaf0", textAlign: "left", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", flex: 1, minWidth: 0, fontWeight: 700 }}>
                          {r.usedCommon && <span title="본주 기준" style={{ color: "#5a6274" }}>●</span>} {r.name}
                        </span>
                        <span style={{ fontSize: 9, color: "#5a6274", flexShrink: 0, whiteSpace: "nowrap" }}>(ROE : 15%↑) (매출액성장률 : 15%↑)</span>
                        <span style={{ color: "#5a6274", flexShrink: 0, fontSize: 10 }}>{isSel ? "▲" : "▼"}</span>
                      </div>
                      {years.length > 0 && (
                        <div style={{ display: "grid", gridTemplateColumns: `68px repeat(${years.length}, 1fr)`, gap: 4 }}>
                          <span></span>
                          {years.map((year) => (
                            <span key={year} className="tnum" style={{ fontSize: 8, color: "#5a6274", textAlign: "center" }}>{fmtYear(year)}</span>
                          ))}
                        </div>
                      )}
                      {renderValueRow("ROE", r.roeAnnual, years, 15)}
                      {renderValueRow("성장", r.growthAnnual, years, 15)}
                    </button>

                    {isSel && (
                      <div className="card" style={{ margin: "6px 0 10px", padding: 12, background: "#161b24" }}>
                        {renderCombinedChart(r)}
                      </div>
                    )}
                  </React.Fragment>
                );
              })}
            </div>
          </div>
        );
      })()}

      {mainView === "chart" && chartTab === "eva" && (() => {
        // EVA(경제적 부가가치) 근사 계산: NOPAT(세후영업이익) - 투하자본×WACC
        // ⚠️ 근사치예요: 법인세율 22%·WACC는 업종별 고정값으로 가정했고(베타·무위험이자율 등 실제 자본비용 데이터가 없음),
        // 투하자본은 총자산-유동부채로 단순화했어요(이자부/비이자부 부채 구분 불가).
        const TAX_RATE = 0.22;

        const buildEvaPts = (s, f, ef) => {
          if (!ef || !Array.isArray(ef.periods)) return [];
          const isSemi = /전기|전자/.test(s.industryName || "");
          const isGame = /오락|문화|게임/.test(s.industryName || "");
          const isBattery = /화학/.test(s.industryName || "");
          const wacc = isSemi ? 0.09 : isGame ? 0.10 : isBattery ? 0.085 : 0.08; // 업종별 대략치(변동성 큰 업종일수록 높게)
          const byPeriod = {};
          ef.periods.forEach((p) => { byPeriod[p.period] = p; });
          return ef.periods
            .map((p) => {
              const opProfit = p.opProfit;
              const totalAssets = p.totalAssets;
              const curLblt = p.curLblt;
              if (opProfit === null || opProfit === undefined || totalAssets === null || totalAssets === undefined || curLblt === null || curLblt === undefined) return null;
              const nopat = opProfit * (1 - TAX_RATE);
              const investedCapital = totalAssets - curLblt;
              if (investedCapital <= 0) return null;
              const eva = nopat - investedCapital * wacc;
              return { period: p.period, value: eva / 100 }; // 백만원 → 억원
            })
            .filter(Boolean);
        };
        const deriveAnnual = (periodPts) => {
          const byYear = {};
          periodPts.forEach((p) => {
            const year = p.period.slice(0, 4);
            const mm = p.period.slice(4, 6);
            if (!byYear[year] || mm >= byYear[year].mm) byYear[year] = { mm, value: p.value };
          });
          return Object.keys(byYear).sort().map((year) => ({ year, value: byYear[year].value }));
        };

        const allRows = stocks
          .filter((s) => s.code && s.name && extraFundamentalsData[s.code])
          .map((s) => {
            const f = fundamentalsData[s.code];
            const ef = extraFundamentalsData[s.code];
            const evaQuarterly = buildEvaPts(s, f, ef);
            if (evaQuarterly.length === 0) return null;
            const annualPts = deriveAnnual(evaQuarterly);
            const value = annualPts[annualPts.length - 1].value;
            return { code: s.code, name: s.name, value, annualPts, evaQuarterly, usedCommon: f ? f.usedCommon : false };
          })
          .filter(Boolean)
          .sort((a, b) => b.value - a.value);

        const palette = ["#c9974a", "#3fbf7f", "#b06fdb", "#40b8c4", "#ee7fb0", "#e0b93c", "#7f8fd8", "#5fbf9f"];
        const topCode = allRows.length > 0 ? allRows[0].code : null;
        const botCode = allRows.length > 0 ? allRows[allRows.length - 1].code : null;
        let oi = 0;
        const styled = allRows.map((r) => {
          if (r.code === topCode) return { ...r, color: "#e8544b", width: 2.1 };
          if (r.code === botCode) return { ...r, color: "#4c8dff", width: 2.1 };
          const c = palette[oi % palette.length]; oi++;
          return { ...r, color: c, width: 1 };
        });

        const fmtVal = (v) => `${v >= 0 ? "+" : ""}${fmt(v)}억`;
        const fmtPct2 = (v) => `${v >= 0 ? "+" : ""}${v.toFixed(1)}%`;
        const fmtPeriod = (p) => (p && p.length === 6 ? `'${p.slice(2, 4)}.${p.slice(4, 6)}` : p);
        const W = 320, H = 190, padL = 44, padR = 6, padT = 8, padB = 18;
        const plotW = W - padL - padR, plotH = H - padT - padB;
        const evaColor = "#e8544b";
        const priceColor = "#c9974a"; // 중간굵기 황금색

        // 주가 월봉에서, EVA 분기 시점(YYYYMM)에 가장 가까운(그 달 이전 최근) 종가를 찾는다.
        const matchAtPeriod = (candles, period) => {
          if (!candles || candles.length === 0) return null;
          const cutoff = period + "31";
          let best = null;
          for (const c of candles) { if (c.date <= cutoff) best = c; else break; }
          return best ? num(best.close) : null;
        };
        const toCumPct = (vals) => {
          const firstIdx = vals.findIndex((v) => v !== null);
          if (firstIdx === -1) return vals.map(() => null);
          const base = vals[firstIdx];
          return vals.map((v) => (v !== null && base !== 0 ? ((v - base) / base) * 100 : null));
        };

        // 종목명 옆 4개년 표시는 전체 종목의 연도 합집합(최근 4개)을 공유해서, 세로 라인이 정확히 맞도록 한다.
        const allYears = [...new Set(styled.flatMap((r) => r.annualPts.map((p) => p.year)))].sort().slice(-4);

        return (
          <div style={{ padding: "calc(env(safe-area-inset-top, 0px) + 10px) 0 0" }}>
            <div style={{ padding: "0 16px 10px", position: "sticky", top: "env(safe-area-inset-top, 0px)", zIndex: 20, background: "#12151b" }}>
              <button onClick={() => setMainView("home")} className="iconbtn" style={{ color: "#c9974a", fontWeight: 700, fontSize: 14 }}>← 뒤로</button>
            </div>
            <div style={{ display: "flex", gap: 6, padding: "0 16px 10px" }}>
              <button onClick={() => { setChartTab("eps"); setFundSelected(null); }} className="iconbtn" style={{ flex: 1, padding: "6px 0", borderRadius: 8, border: chartTab === "eps" ? "1px solid #c9974a" : "1px solid #262c37", background: chartTab === "eps" ? "rgba(201,151,74,0.15)" : "#1a1f28", color: chartTab === "eps" ? "#c9974a" : "#8993a6", fontWeight: 700, fontSize: 12 }}>EPS성장률</button>
              <button onClick={() => { setChartTab("psr"); setFundSelected(null); }} className="iconbtn" style={{ flex: 1, padding: "6px 0", borderRadius: 8, border: chartTab === "psr" ? "1px solid #c9974a" : "1px solid #262c37", background: chartTab === "psr" ? "rgba(201,151,74,0.15)" : "#1a1f28", color: chartTab === "psr" ? "#c9974a" : "#8993a6", fontWeight: 700, fontSize: 12 }}>PSR</button>
              <button onClick={() => { setChartTab("roe"); setFundSelected(null); }} className="iconbtn" style={{ flex: 1, padding: "6px 0", borderRadius: 8, border: chartTab === "roe" ? "1px solid #c9974a" : "1px solid #262c37", background: chartTab === "roe" ? "rgba(201,151,74,0.15)" : "#1a1f28", color: chartTab === "roe" ? "#c9974a" : "#8993a6", fontWeight: 700, fontSize: 12 }}>ROE·성장률</button>
              <button onClick={() => { setChartTab("eva"); setFundSelected(null); }} className="iconbtn" style={{ flex: 1, padding: "6px 0", borderRadius: 8, border: chartTab === "eva" ? "1px solid #c9974a" : "1px solid #262c37", background: chartTab === "eva" ? "rgba(201,151,74,0.15)" : "#1a1f28", color: chartTab === "eva" ? "#c9974a" : "#8993a6", fontWeight: 700, fontSize: 12 }}>EVA</button>
            </div>
            <div style={{ padding: "0 16px 20px" }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: "#e7eaf0", marginBottom: 4 }}>종목챠트 · EVA</div>
              <div style={{ fontSize: 10, color: "#5a6274", marginBottom: 10 }}>
                EVA(경제적 부가가치) = 세후영업이익(NOPAT) − 투하자본×WACC로 근사 계산했어요. ⚠️ 법인세율 22%·WACC는 업종별 고정 가정치라 실제 자본비용과 차이가 있을 수 있어요(베타·무위험이자율 데이터 없음). 투하자본은 총자산−유동부채로 단순화했어요. 우선주는 본주 재무데이터를 사용해요. 탭하면 EVA(붉은선, 자체 기준 누적%)에 주가(황금색, 누적%) 추이가 겹쳐 나와요.
              </div>
              {fundamentalsLoading && <div style={{ color: "#8993a6", fontSize: 12, textAlign: "center", padding: 16 }}>불러오는 중...</div>}
              {!fundamentalsLoading && styled.length === 0 && (
                <div style={{ color: "#5a6274", fontSize: 12, textAlign: "center", padding: 20 }}>표시할 데이터가 없어요. 종목을 눌러 "재무데이터"를 한 번 펼쳐보시면 EVA 계산에 필요한 데이터가 받아져요.</div>
              )}
              {styled.map((r, i) => {
                const isSel = fundSelected === r.code;
                const yoyColor = (year) => {
                  const idx = r.annualPts.findIndex((p) => p.year === year);
                  if (idx <= 0) return "#8993a6";
                  const cur = r.annualPts[idx].value, prev = r.annualPts[idx - 1].value;
                  if (cur > prev) return "#e8544b";
                  if (cur < prev) return "#4c8dff";
                  return "#8993a6";
                };
                return (
                  <React.Fragment key={r.code}>
                    <button
                      type="button"
                      onClick={() => setFundSelected((cur) => (cur === r.code ? null : r.code))}
                      style={{
                        width: "100%", padding: "5px 6px", fontSize: 12,
                        border: isSel ? `1px solid ${r.color}` : "1px solid transparent",
                        background: isSel ? "rgba(255,255,255,0.06)" : "none",
                        borderRadius: 6,
                      }}
                    >
                      <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                        <span style={{ color: "#5a6274", minWidth: 14, textAlign: "right", flexShrink: 0, fontSize: 11 }}>{i + 1}</span>
                        <span style={{ width: 10, height: r.width >= 2 ? 4 : 2, background: r.color, borderRadius: 2, flexShrink: 0 }} />
                        <span style={{ color: "#e7eaf0", textAlign: "left", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", flex: 1, minWidth: 0, fontWeight: 700 }}>
                          {r.usedCommon && <span title="본주 기준" style={{ color: "#5a6274" }}>●</span>} {r.name}
                        </span>
                        <span style={{ fontSize: 9, color: "#5a6274", flexShrink: 0, whiteSpace: "nowrap" }}>(0↑)</span>
                        <span style={{ color: "#5a6274", flexShrink: 0, fontSize: 10 }}>{isSel ? "▲" : "▼"}</span>
                      </div>
                      <div style={{ display: "grid", gridTemplateColumns: `repeat(${allYears.length}, 48px)`, gap: 6, marginTop: 2, justifyContent: "flex-end" }}>
                        {allYears.map((y) => {
                          const p = r.annualPts.find((x) => x.year === y);
                          const isExcellent = p && p.value > 0;
                          return (
                            <div key={y} className="tnum" style={{ display: "flex", flexDirection: "column", alignItems: "center", flexShrink: 0 }}>
                              <span style={{ color: "#5a6274", fontSize: 8 }}>{y + "년"}</span>
                              <span style={{
                                fontWeight: 700, fontSize: 12, color: p ? yoyColor(y) : "#3a4150", lineHeight: 1.2,
                                border: isExcellent ? "1px solid #e8544b" : "1px solid transparent",
                                borderRadius: 4, padding: "1px 4px",
                              }}>{p ? fmtVal(p.value) : "-"}</span>
                            </div>
                          );
                        })}
                      </div>
                    </button>

                    {isSel && (() => {
                      const pts = r.evaQuarterly;
                      const evaPts = toCumPct(pts.map((p) => p.value));
                      const overlay = chartOverlay && chartOverlay.code === r.code ? chartOverlay : null;
                      const pricePts = overlay ? toCumPct(pts.map((p) => matchAtPeriod(overlay.price, p.period))) : null;
                      const extraVals = [pricePts].filter(Boolean).flatMap((arr) => arr.filter((v) => v !== null));
                      let vMin = Math.min(...evaPts.filter((v) => v !== null), ...extraVals, 0);
                      let vMax = Math.max(...evaPts.filter((v) => v !== null), ...extraVals, 0);
                      const vPad = Math.max((vMax - vMin) * 0.1, 1);
                      vMin -= vPad; vMax += vPad;
                      const xOf = (idx, len) => padL + (len <= 1 ? 0 : (idx / (len - 1)) * plotW);
                      const yOf = (v) => padT + (vMax === vMin ? plotH / 2 : ((vMax - v) / (vMax - vMin)) * plotH);
                      const lineOfVals = (vals) => {
                        const segs = [];
                        let cur = [];
                        vals.forEach((v, idx) => {
                          if (v === null) { if (cur.length > 1) segs.push(cur); cur = []; return; }
                          cur.push(`${xOf(idx, pts.length)},${yOf(v)}`);
                        });
                        if (cur.length > 1) segs.push(cur);
                        return segs.map((s) => s.join(" "));
                      };
                      const lastPrice = pricePts ? [...pricePts].reverse().find((v) => v !== null) : null;
                      const lastEva = [...evaPts].reverse().find((v) => v !== null);
                      return (
                        <div className="card" style={{ margin: "6px 0 10px", padding: 12, background: "#161b24" }}>
                          <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: 10, marginBottom: 8, fontSize: 10, color: "#8993a6" }}>
                            <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
                              <svg width="16" height="4"><line x1="0" y1="2" x2="16" y2="2" stroke={evaColor} strokeWidth="1.6" /></svg>
                              EVA(누적%) {lastEva !== null && <span className="tnum" style={{ fontWeight: 700, color: evaColor }}>{fmtPct2(lastEva)}</span>}
                            </span>
                            {chartOverlayLoading && <span>겹쳐그릴 데이터 불러오는 중...</span>}
                            {lastPrice !== null && (
                              <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
                                <svg width="16" height="4"><line x1="0" y1="2" x2="16" y2="2" stroke={priceColor} strokeWidth="1.6" /></svg>
                                주가 <span className="tnum" style={{ fontWeight: 700, color: priceColor }}>{fmtPct2(lastPrice)}</span>
                              </span>
                            )}
                          </div>
                          <div style={{ fontSize: 9, color: "#5a6274", marginBottom: 6 }}>
                            이 차트는 EVA·주가 모두 첫 시점 대비 누적 변화율(%)로 정규화해서 겹쳐 그려요 (단위가 달라 절대값 비교는 어려워요).
                          </div>
                          <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block", background: "#12151b", borderRadius: 10, border: "1px solid #262c37" }}>
                            {[vMax, (vMax + vMin) / 2, vMin].map((v, vi) => (
                              <g key={vi}>
                                <line x1={padL} y1={yOf(v)} x2={W - padR} y2={yOf(v)} stroke="#1f2530" strokeWidth="1" />
                                <text x={padL - 4} y={yOf(v) + 3} fill="#5a6274" fontSize="8" textAnchor="end">{v.toFixed(0)}%</text>
                              </g>
                            ))}
                            {vMin < 0 && vMax > 0 && <line x1={padL} y1={yOf(0)} x2={W - padR} y2={yOf(0)} stroke="#3a4150" strokeWidth="1" strokeDasharray="3 3" />}
                            {pricePts && lineOfVals(pricePts).map((seg, idx) => (
                              <polyline key={"pr" + idx} fill="none" stroke={priceColor} strokeWidth="1.6" strokeLinejoin="round" points={seg} />
                            ))}
                            {lineOfVals(evaPts).map((seg, idx) => (
                              <polyline key={"ev" + idx} fill="none" stroke={evaColor} strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round" points={seg} />
                            ))}
                            {pts.map((p, idx) => evaPts[idx] !== null && <circle key={p.period} cx={xOf(idx, pts.length)} cy={yOf(evaPts[idx])} r="2" fill={evaColor} />)}
                            <text x={padL} y={H - 5} fill="#5a6274" fontSize="8" textAnchor="start">{fmtPeriod(pts[0].period)}</text>

        const plotW = W - padL - padR, plotH = H - padT - padB;

            cur.push(`${xOf(idx, len)},${yOf(v)}`);

                <button className="iconbtn" onClick={() => setCandleStock(candleStock === r.id ? null : r.id)} style={{ fontSize: 11, color: "#8993a6" }}>
                  강약챠트 {candleStock === r.id ? "▴" : "▾"}
                </button>
                <button className="iconbtn" onClick={() => setMetricsStock(metricsStock === r.id ? null : r.id)} style={{ fontSize: 11, color: "#8993a6" }}>
                  재무데이터 {metricsStock === r.id ? "▴" : "▾"}
                </button>
              </div>
              {manualCodeFor === r.id && (
                <div style={{ marginTop: 8 }}>
                  <div className="lbl">종목명이 사전에 없어서 자동완성이 안 뜰 때, 종목코드를 직접 입력하세요 (예: 코스모신소재 005070)</div>
                  <input
                    placeholder="종목코드 6자리"
                    defaultValue={r.code}
                    onBlur={(e) => updateStock(r.id, "code", e.target.value.trim())}
                    className="field"
                  />
                </div>
              )}
              {candleStock === r.id && (
                <div style={{ marginTop: 8 }}>
                  <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
                    {[["30MIN", "30분"], ["D", "일봉"], ["W", "주봉"], ["M", "월봉"], ["Y", "년봉"]].map(([code, label]) => (
                      <button
                        key={code}
                        onClick={() => setStrengthPeriod(code)}
                        className="iconbtn"
                        style={{ flex: 1, padding: "5px 0", borderRadius: 8, border: strengthPeriod === code ? "1px solid #c9974a" : "1px solid #262c37", background: strengthPeriod === code ? "rgba(201,151,74,0.15)" : "#1a1f28", color: strengthPeriod === code ? "#c9974a" : "#8993a6", fontWeight: 700, fontSize: 11 }}
                      >
                        {label}
                      </button>
                    ))}
                  </div>
                  {strengthLoading && !strengthData[`${r.code}:${strengthPeriod}`] && (
                    <div style={{ color: "#8993a6", fontSize: 11, textAlign: "center", padding: 10 }}>불러오는 중...</div>
                  )}
                  {renderCandles(r.name, strengthData[`${r.code}:${strengthPeriod}`] || [])}
                </div>
              )}
              {metricsStock === r.id && (() => {
                const f = r.code ? fundamentalsData[r.code] : null;
                const ef = r.code ? extraFundamentalsData[r.code] : null;
                const isLoading = r.code && (fundamentalsLoading || extraFundamentalsLoading[r.code]) && (!f || !ef);
                if (isLoading) return <div style={{ marginTop: 6, fontSize: 11, color: "#8993a6" }}>불러오는 중...</div>;
                if (!f && !ef) return <div style={{ marginTop: 6, fontSize: 11, color: "#5a6274" }}>{r.code ? "데이터 없음" : "종목코드가 필요해요"}</div>;

                // 분기 포인트를 연도별로 묶어서(그 해 마지막 분기 값), 5개년을 쓴다 (표시는 최근 4개년만, 1년 더 받는 건 첫 해의 "전년 대비" 색을 매기기 위함).
                const deriveAnnual = (periodPts) => {
                  const byYear = {};
                  periodPts.forEach((p) => {
                    const year = p.period.slice(0, 4);
                    const mm = p.period.slice(4, 6);
                    if (!byYear[year] || mm >= byYear[year].mm) byYear[year] = { mm, value: p.value };
                  });
                  return Object.keys(byYear).sort().slice(-5).map((year) => ({ year, value: byYear[year].value }));
                };
                const buildFrom = (periods, field, transform) => deriveAnnual(
                  (periods || [])
                    .map((p) => ({ period: p.period, value: p[field] !== null && p[field] !== undefined ? (transform ? transform(p[field], p) : num(p[field])) : null }))
                    .filter((p) => p.value !== null && !isNaN(p.value))
                );
                const buildGrowth = (periods, field) => {
                  const raw = (periods || [])
                    .map((p) => ({ period: p.period, value: p[field] !== null && p[field] !== undefined ? num(p[field]) : null }))
                    .filter((p) => p.value !== null && !isNaN(p.value));
                  const lag = (f && f.divUsed === "annual") ? 1 : 4;
                  const growth = [];
                  for (let idx = lag; idx < raw.length; idx++) {
                    const prev = raw[idx - lag].value, cur = raw[idx].value;
                    if (prev !== 0) growth.push({ period: raw[idx].period, value: ((cur - prev) / Math.abs(prev)) * 100 });
                  }
                  return deriveAnnual(growth);
                };

                const price = num(r.cur);
                const buildRatio2 = (periods, numField, denomField, mult) => deriveAnnual(
                  (periods || [])
                    .map((p) => {
                      const n = p[numField], d = p[denomField];
                      const v = (n !== null && n !== undefined && d) ? (num(n) / num(d)) * (mult || 1) : null;
                      return { period: p.period, value: v };
                    })
                    .filter((p) => p.value !== null && !isNaN(p.value))
                );
                const revenueAnnual = buildFrom(ef && ef.periods, "revenue", (v) => v / 100); // 백만원 단위로 추정 → 억원으로 환산
                const revenueGrowthAnnual = f ? deriveAnnual(f.periods.map((p) => ({ period: p.period, value: p.revenueGrowth !== null && p.revenueGrowth !== undefined ? num(p.revenueGrowth) : null })).filter((p) => p.value !== null)) : [];
                const opMarginAnnual = buildRatio2(ef && ef.periods, "opProfit", "revenue", 100);
                const netMarginAnnual = buildRatio2(ef && ef.periods, "netIncome", "revenue", 100);
                const epsAnnual = f ? buildFrom(f.periods, "eps") : [];
                const epsGrowthAnnual = f ? buildGrowth(f.periods, "eps") : [];
                const bpsAnnual = f ? buildFrom(f.periods, "bps") : [];
                const perAnnual = f ? buildFrom(f.periods, "eps", (v) => (v && price ? price / num(v) : null)) : [];
                const roeAnnual = f ? buildFrom(f.periods, "roe") : [];
                const psrAnnual = f ? buildFrom(f.periods, "sps", (v) => (v && price ? price / num(v) : null)) : [];
                const pbrAnnual = f ? buildFrom(f.periods, "bps", (v) => (v && price ? price / num(v) : null)) : [];
                const debtRatioAnnual = f ? buildFrom(f.periods, "debtRatio") : [];
                const quickRatioAnnual = buildFrom(ef && ef.periods, "quickRatio");

                // 우수=붉은색, 양호=금색, 보통=회색, 위험=파란색 (한국 증시 관례: 붉은=좋음/저평가, 파란=나쁨/고평가)
                const tier4 = (t1, t2, t3, reversed) => (v) => {
                  if (!reversed) {
                    if (v >= t3) return "#e8544b";
                    if (v >= t2) return "#e0b93c";
                    if (v >= t1) return "#8993a6";
                    return "#4c8dff";
                  }
                  if (v < t1) return "#e8544b";
                  if (v < t2) return "#e0b93c";
                  if (v < t3) return "#8993a6";
                  return "#4c8dff";
                };
                // 3단계(우수/양호/위험, 보통 없음) — 2차전지·화학 영업이익률처럼 중간 구간을 명시 안 한 업종별 기준에 씀
                const tier3 = (t1, t2) => (v) => (v >= t2 ? "#e8544b" : v >= t1 ? "#e0b93c" : "#4c8dff");
                const perColorWith = (lo, mid) => (v) => (v < 0 ? "#4c8dff" : v < lo ? "#e8544b" : v < mid ? "#8993a6" : "#4c8dff");
                const pbrColorWith = (lo, hi) => (v) => (v < lo ? "#e8544b" : v < hi ? "#8993a6" : "#4c8dff");
                const psrColorWith = (lo, hi) => (v) => (v < lo ? "#e8544b" : v < hi ? "#8993a6" : "#4c8dff");
                const quickRatioColor = (v) => (v >= 150 ? "#e8544b" : v >= 100 ? "#e0b93c" : "#4c8dff");

                // 업종별 기준선 — 종목의 업종명으로 감지해서 반도체/게임/2차전지는 전용 기준, 그 외는 일반 기준을 쓴다.
                const industryName = r.industryName || "";
                const isSemi = /전기|전자/.test(industryName);
                const isGame = /오락|문화|게임/.test(industryName);
                const isBattery = /화학/.test(industryName);
                let profileLabel = "일반 기준";
                let perColor, pbrColor, psrColor, opMarginTier, roeTier, debtTier;
                let perRange, pbrRange, psrRange, opMarginRange, roeRange, debtRange;
                if (isSemi) {
                  profileLabel = "반도체·부품 업종 기준";
                  perColor = perColorWith(15, 25); perRange = "15↓";
                  pbrColor = pbrColorWith(2, 4); pbrRange = "2↓";
                  psrColor = psrColorWith(1, 2); psrRange = "1↓"; // PSR은 업종별 기준 미제공 → 일반 기준 유지
                  opMarginTier = tier4(8, 15, 25); opMarginRange = "25%↑";
                  roeTier = tier4(5, 12, 20); roeRange = "20%↑";
                  debtTier = tier4(50, 100, 200, true); debtRange = "50%↓";
                } else if (isGame) {
                  profileLabel = "게임 업종 기준";
                  perColor = perColorWith(15, 30); perRange = "15↓";
                  pbrColor = pbrColorWith(1, 1.5); pbrRange = "1↓"; // PBR은 업종별 기준 미제공 → 일반 기준 유지
                  psrColor = psrColorWith(3, 6); psrRange = "3↓";
                  opMarginTier = tier4(8, 15, 30); opMarginRange = "30%↑";
                  roeTier = tier4(5, 10, 15); roeRange = "15%↑"; // 업종별 기준 미제공 → 일반 기준 유지
                  debtTier = tier4(50, 100, 200, true); debtRange = "50%↓";
                } else if (isBattery) {
                  profileLabel = "2차전지·화학 업종 기준";
                  perColor = perColorWith(10, 20); perRange = "10↓";
                  pbrColor = pbrColorWith(1.5, 3); pbrRange = "1.5↓";
                  psrColor = psrColorWith(1, 2); psrRange = "1↓"; // 업종별 기준 미제공 → 일반 기준 유지
                  opMarginTier = tier3(5, 10); opMarginRange = "10%↑"; // 우수10%+/양호5~10%/위험5%↓ (보통 구간 없음)
                  roeTier = tier4(5, 10, 15); roeRange = "15%↑"; // 업종별 기준 미제공 → 일반 기준 유지
                  debtTier = tier4(50, 100, 150, true); debtRange = "50%↓"; // 위험선 150%로 낮춤
                } else {
                  perColor = perColorWith(10, 15); perRange = "10↓";
                  pbrColor = pbrColorWith(1, 1.5); pbrRange = "1↓";
                  psrColor = psrColorWith(1, 2); psrRange = "1↓";
                  opMarginTier = tier4(3, 8, 15); opMarginRange = "15%↑";
                  roeTier = tier4(5, 10, 15); roeRange = "15%↑";
                  debtTier = tier4(50, 100, 200, true); debtRange = "50%↓";
                }

                // 절대값 지표(매출액·EPS·BPS)는 업종 기준선이 없어서, 전년 대비 증감으로 색을 매긴다.
                const yoyColorFor = (pts) => (year) => {
                  const idx = pts.findIndex((p) => p.year === year);
                  if (idx <= 0) return "#e7eaf0";
                  const cur = pts[idx].value, prev = pts[idx - 1].value;
                  if (cur > prev) return "#e8544b";
                  if (cur < prev) return "#4c8dff";
                  return "#e7eaf0";
                };

                const rows = [
                  ["매출액(억원)", revenueAnnual, (v) => fmt(v), null, null],
                  ["매출액성장률", revenueGrowthAnnual, (v) => `${v >= 0 ? "+" : ""}${v.toFixed(1)}%`, tier4(0, 5, 15), "15%↑"],
                  ["영업이익률", opMarginAnnual, (v) => `${v >= 0 ? "+" : ""}${v.toFixed(1)}%`, opMarginTier, opMarginRange],
                  ["순이익률", netMarginAnnual, (v) => `${v >= 0 ? "+" : ""}${v.toFixed(1)}%`, tier4(2, 5, 10), "10%↑"],
                  ["EPS", epsAnnual, (v) => fmt(v), null, null],
                  ["EPS성장률", epsGrowthAnnual, (v) => `${v >= 0 ? "+" : ""}${v.toFixed(1)}%`, tier4(0, 5, 15), "15%↑"],
                  ["BPS", bpsAnnual, (v) => fmt(v), null, null],
                  ["PER", perAnnual, (v) => (v < 0 ? "극저" : v >= 100 ? "극고" : `${v.toFixed(1)}배`), perColor, perRange],
                  ["ROE", roeAnnual, (v) => `${v >= 0 ? "+" : ""}${v.toFixed(1)}%`, roeTier, roeRange],
                  ["PSR", psrAnnual, (v) => `${v.toFixed(2)}배`, psrColor, psrRange],
                  ["PBR", pbrAnnual, (v) => `${v.toFixed(2)}배`, pbrColor, pbrRange],
                  ["부채비율", debtRatioAnnual, (v) => `${v.toFixed(1)}%`, debtTier, debtRange],
                  ["당좌비율", quickRatioAnnual, (v) => `${v.toFixed(1)}%`, quickRatioColor, "150%↑"],
                ];
                const allYears = [...new Set(rows.flatMap(([, pts]) => pts.map((p) => p.year)))].sort().slice(-4);

                return (
                  <div style={{ marginTop: 6, fontSize: 11, color: "#5a6274" }}>
                    <div style={{ marginBottom: 4, color: "#c9974a", fontWeight: 700 }}>기준선: {profileLabel}</div>
                    {allYears.length === 0 ? (
                      <div>표시할 데이터가 없어요.</div>
                    ) : (
                      <>
                        <div style={{ display: "grid", gridTemplateColumns: `1fr repeat(${allYears.length}, 60px)`, gap: 4, marginBottom: 3, fontWeight: 700, color: "#8993a6" }}>
                          <div></div>
                          {allYears.map((y) => <div key={y} className="tnum" style={{ textAlign: "center", fontSize: 12 }}>{y + "년"}</div>)}
                        </div>
                        {rows.map(([label, pts, formatter, colorFn, excellentRange]) => {
                          const yoy = yoyColorFor(pts);
                          return (
                            <div key={label} style={{ display: "grid", gridTemplateColumns: `1fr repeat(${allYears.length}, 60px)`, gap: 4, padding: "3px 0", borderTop: "1px solid #1a1f28" }}>
                              <div style={{ color: "#8993a6", fontSize: 11, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                                {label}
                                {excellentRange && <span style={{ fontSize: 9, color: "#5a6274" }}> ({excellentRange})</span>}
                              </div>
                              {allYears.map((y) => {
                                const p = pts.find((x) => x.year === y);
                                const color = !p ? "#3a4150" : yoy(y);
                                const isExcellent = p && colorFn && colorFn(p.value) === "#e8544b";
                                return (
                                  <div
                                    key={y}
                                    className="tnum"
                                    style={{
                                      textAlign: "center", fontWeight: 700, fontSize: 12, color, lineHeight: 1.2,
                                      border: isExcellent ? "1px solid #e8544b" : "1px solid transparent",
                                      borderRadius: 4, padding: "1px 3px",
                                    }}
                                  >
                                    {p ? formatter(p.value) : "-"}
                                  </div>
                                );
                              })}
                            </div>
                          );
                        })}
                        <div style={{ marginTop: 6, fontSize: 9 }}>
                          당좌비율은 유동자산÷유동부채로 근사 계산했어요(재고자산 분리 불가). PER이 마이너스면 "극저", 100배 이상이면 "극고"로 표시돼요. 우선주는 본주 재무데이터를 사용해요. 색은 전년 대비 증가(붉은색)·감소(파란색)로만 표시되고, 그 수치가 "우수" 기준을 만족하면 <span style={{ border: "1px solid #e8544b", padding: "0 3px", borderRadius: 3 }}>테두리</span>가 추가돼요.
                          <br /><span style={{ color: "#e8544b" }}>●우수</span> <span style={{ color: "#e0b93c" }}>●양호</span> <span style={{ color: "#8993a6" }}>●보통/적정</span> <span style={{ color: "#4c8dff" }}>●주의</span> · 업종명을 인식해 반도체·게임·2차전지는 전용 기준선을, 그 외는 일반 기준선을 적용해요. 업종별로 기준이 없는 지표는 일반 기준을 그대로 써요.
                        </div>
                      </>
                    )}
                  </div>
                );
              })()}
              {expanded && (
                <div style={{ marginTop: 6, fontSize: 11, color: "#c3c9d4", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
                  <div>수익기준 비중: {fmtPct(r.profitWeight)} (랭킹 {r.profitRank ?? "-"})</div>
                  <div>매입기준 비중: {fmtPct(r.purchaseWeight)} (랭킹 {r.purchaseRank ?? "-"})</div>
                  <div>비중 평균: {fmtPct(r.avgWeight)} (랭킹 {r.avgRank ?? "-"})</div>
                  <div>비중 차이: {fmtPct(r.diffWeight)}</div>
                  <div>
                    <div className="lbl">가상매도수량</div>
                    <input className="field" type="text" inputMode="numeric" value={r.vSellQty === 0 ? "" : toDisplay(r.vSellQty)} onChange={(e) => updateStock(r.id, "virtualSellQty", fromDisplay(e.target.value))} placeholder="수량입력" />
                  </div>
                  <div>
                    <div className="lbl">가상매수수량</div>
                    <input className="field" type="text" inputMode="numeric" value={r.vBuyQty === 0 ? "" : toDisplay(r.vBuyQty)} onChange={(e) => updateStock(r.id, "virtualBuyQty", fromDisplay(e.target.value))} placeholder="수량입력" />
                  </div>
                  {(r.vSellQty !== 0 || r.vBuyQty !== 0) && (
                    <div style={{ gridColumn: "1 / span 2", marginTop: 4, padding: 8, background: "#161a22", borderRadius: 8 }}>
                      <div style={{ marginBottom: 4 }}>
                        가상 실행 시 보유수량: {fmt(r.qty)}주 → <span style={{ fontWeight: 700, color: r.vsell > 0 ? "#e8544b" : r.vsell < 0 ? "#4c8dff" : "#e7eaf0" }}>{fmt(r.effQty)}주</span>
                        {" "}({r.vsell > 0 ? "+" : ""}{fmt(r.vsell)}주)
                      </div>
                      <div style={{ fontWeight: 700, color: r.vCashImpact > 0 ? "#e8544b" : r.vCashImpact < 0 ? "#4c8dff" : "#e7eaf0" }}>
                        현금 변화: {r.vCashImpact > 0 ? "+" : ""}{fmt(r.vCashImpact)}원 {r.vCashImpact > 0 ? "(매도로 현금 유입)" : r.vCashImpact < 0 ? "(매수로 현금 유출)" : ""}
                      </div>
                      <div style={{ marginTop: 4, display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8 }}>
                        <span>
                          투자가능현금흐름: <span style={{ fontWeight: 700, color: investableCash - r.vCashImpact >= 0 ? "#e8544b" : "#4c8dff" }}>{investableCash - r.vCashImpact >= 0 ? "+" : ""}{fmt(investableCash - r.vCashImpact)}원</span>
                          {" → "}
                          <span style={{ fontWeight: 700, color: investableCash >= 0 ? "#e8544b" : "#4c8dff" }}>{investableCash >= 0 ? "+" : ""}{fmt(investableCash)}원</span>
                        </span>
                        <span style={{ flexShrink: 0, color: "#8993a6" }}>
                          현금비중 <span style={{ fontWeight: 700, color: "#e7eaf0" }}>{fmtPct(cashRatio)}</span>
                        </span>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
        <button className="iconbtn" onClick={addStock} style={{ border: "1px dashed #3a4150", color: "#8993a6", borderRadius: 10, padding: "10px 0", fontSize: 13 }}>+ 종목 추가</button>
      </div>
      </div>
      )}

      {mainView === "cash" && (
      <div style={{ padding: "calc(env(safe-area-inset-top, 0px) + 10px) 0 0" }}>
        <div style={{ padding: "0 16px 10px", position: "sticky", top: "env(safe-area-inset-top, 0px)", zIndex: 20, background: "#12151b" }}>
          <button onClick={() => setMainView("home")} className="iconbtn" style={{ color: "#c9974a", fontWeight: 700, fontSize: 14 }}>← 뒤로</button>
        </div>
      <div className="card tnum" style={{ margin: "0 16px 10px", padding: 8, display: "flex", justifyContent: "space-between" }}>
        <div>
          <div className="lbl">💰 보유현금합계</div>
          <div style={{ fontSize: 16, fontWeight: 700 }}>{fmt(cashCalc.totalCash)}원</div>
        </div>
        <div style={{ textAlign: "right" }}>
          <div className="lbl">투자가능현금</div>
          <div style={{ fontSize: 16, fontWeight: 700, color: investableCash >= 0 ? "#e8544b" : "#4c8dff" }}>
            {investableCash >= 0 ? "+" : ""}{fmt(investableCash)}원
          </div>
        </div>
      </div>
      <div style={{ padding: "18px 16px 8px", fontSize: 13, fontWeight: 700, color: "#c9974a" }}>현금 계좌</div>
      <div style={{ padding: "0 16px", display: "flex", flexDirection: "column", gap: 8 }}>
        {sortedCashRows.map((a, idx) => (
          <div key={a.id} className="card tnum" style={{ padding: 8 }}>
            <div style={{ display: "flex", gap: 8, marginBottom: 4, alignItems: "center" }}>
              <span style={{ flexShrink: 0, fontSize: 12, color: "#8993a6", fontWeight: 700, minWidth: 14, textAlign: "right" }}>{idx === 0 ? "📌" : idx + 1}</span>
              <input className="field" placeholder="계좌명" value={a.name} onChange={(e) => updateCash(a.id, "name", e.target.value)} style={{ flex: 2, fontWeight: 600 }} />
              <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                <button className="iconbtn" onClick={() => moveCash(a.id, -1)} disabled={idx <= 1} style={{ padding: "0 6px", color: idx <= 1 ? "#3a4150" : "#8993a6", fontSize: 12, lineHeight: 1 }}>▲</button>
                <button className="iconbtn" onClick={() => moveCash(a.id, 1)} disabled={idx === 0 || idx === sortedCashRows.length - 1} style={{ padding: "0 6px", color: (idx === 0 || idx === sortedCashRows.length - 1) ? "#3a4150" : "#8993a6", fontSize: 12, lineHeight: 1 }}>▼</button>
              </div>
              <button className="iconbtn" onClick={() => removeCash(a.id)} style={{ padding: 4, color:"#5a6274", fontSize:14 }}>🗑</button>
            </div>
            {idx === 0 ? (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 4 }}>
                <div>
                  <div className="lbl" style={{ textAlign: "center" }}>현금(주투자계좌)</div>
                  <input className="field" type="text" inputMode="numeric" value={num(a.cash) === 0 ? "" : toDisplay(a.cash)} onChange={(e) => updateCash(a.id, "cash", fromDisplay(e.target.value))} placeholder="금액입력" style={{ textAlign: "center" }} />
                  <div style={{ fontSize: 9, color: "#5a6274", marginTop: 3, whiteSpace: "nowrap" }}>투자하거나 현금사용</div>
                </div>
                <div></div>
                <div>
                  <div className="lbl" style={{ textAlign: "center" }}>사용한돈/투자한돈</div>
                  <input className="field" type="text" inputMode="numeric" value={num(a.used) === 0 ? "" : toDisplay(a.used)} onChange={(e) => updateCash(a.id, "used", fromDisplay(e.target.value))} placeholder="금액입력" style={{ marginBottom: 3, textAlign: "center" }} />
                  <div style={{ display: "flex", gap: 4, justifyContent: "center" }}>
                    <button
                      type="button"
                      onClick={() => applyUsedAmount(a.id, "spend")}
                      style={{ padding: "4px 8px", borderRadius: 6, fontSize: 11, fontWeight: 700, border: "1px solid #4c8dff", background: "rgba(76,141,255,0.12)", color: "#4c8dff", whiteSpace: "nowrap" }}
                    >
                      ➖ 사용
                    </button>
                    <button
                      type="button"
                      onClick={() => applyUsedAmount(a.id, "invest")}
                      style={{ padding: "4px 8px", borderRadius: 6, fontSize: 11, fontWeight: 700, border: "1px solid #e8544b", background: "rgba(232,84,75,0.12)", color: "#e8544b", whiteSpace: "nowrap" }}
                    >
                      ➕ 투자
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 4 }}>
                <div>
                  <div className="lbl" style={{ textAlign: "center" }}>현금(보조투자계좌)</div>
                  <input className="field" type="text" inputMode="numeric" value={num(a.cash) === 0 ? "" : toDisplay(a.cash)} onChange={(e) => updateCash(a.id, "cash", fromDisplay(e.target.value))} placeholder="금액입력" style={{ textAlign: "center" }} />
                  <div style={{ fontSize: 9, color: "#5a6274", marginTop: 3, whiteSpace: "nowrap" }}>투자금으로 빌려주거나 갚을 수 있음</div>
                </div>
                <div>
                  <div className="lbl" style={{ textAlign: "center" }}>빌려투자한돈</div>
                  <input className="field" type="text" inputMode="numeric" value={num(a.pledged) === 0 ? "" : toDisplay(a.pledged)} onChange={(e) => updateCash(a.id, "pledged", fromDisplay(e.target.value))} onFocus={() => handlePledgedFocus(a.id, a.pledged)} onBlur={() => handlePledgedBlur(a.id)} placeholder="금액입력" style={{ textAlign: "center" }} />
                  <div className="lbl" style={{ marginTop: 4, textAlign: "center" }}>이자(연10%, 일할)</div>
                  <input className="field" type="text" inputMode="numeric" value={num(a.interest) === 0 ? "" : toDisplay(a.interest)} onChange={(e) => updateInterestCapped(a.id, fromDisplay(e.target.value))} onFocus={() => handleInterestFocus(a.id, a.interest)} onBlur={() => handleInterestBlur(a.id)} placeholder="자동 계산" style={{ textAlign: "center" }} />
                </div>
                <div>
                  <div className="lbl" style={{ textAlign: "center" }}>상환한돈/대출한돈</div>
                  <input className="field" type="text" inputMode="numeric" value={num(a.repayLoan) === 0 ? "" : toDisplay(a.repayLoan)} onChange={(e) => updateCash(a.id, "repayLoan", fromDisplay(e.target.value))} placeholder="금액입력" style={{ marginBottom: 3, textAlign: "center" }} />
                  <div style={{ display: "flex", gap: 4, justifyContent: "center" }}>
                    <button
                      type="button"
                      onClick={() => applyPledgedAmount(a.id, "repay")}
                      style={{ padding: "4px 8px", borderRadius: 6, fontSize: 11, fontWeight: 700, border: "1px solid #4c8dff", background: "rgba(76,141,255,0.12)", color: "#4c8dff", whiteSpace: "nowrap" }}
                    >
                      ➖ 상환
                    </button>
                    <button
                      type="button"
                      onClick={() => applyPledgedAmount(a.id, "borrow")}
                      style={{ padding: "4px 8px", borderRadius: 6, fontSize: 11, fontWeight: 700, border: "1px solid #e8544b", background: "rgba(232,84,75,0.12)", color: "#e8544b", whiteSpace: "nowrap" }}
                    >
                      ➕ 대출
                    </button>
                  </div>
                </div>
              </div>
            )}
            <div style={{ textAlign: "right", marginTop: 4, fontSize: 13, color: "#8993a6" }}>합계 <span style={{ color: "#e7eaf0", fontWeight: 700 }}>{fmt(a.total)}원</span></div>
          </div>
        ))}
        <button className="iconbtn" onClick={addCash} style={{ border: "1px dashed #3a4150", color: "#8993a6", borderRadius: 10, padding: "10px 0", fontSize: 13, marginBottom: 20 }}>+ 계좌 추가</button>
      </div>
      </div>
      )}

      {mainView === "home" && (<>
      <div style={{ padding: "0 16px 10px", display: "flex", gap: 8 }}>
        <button onClick={() => setMainView("stocks")} className="iconbtn" style={{ flex: 1, padding: "8px 0", borderRadius: 10, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 13 }}>
          📈 보유종목
        </button>
        <button onClick={() => setMainView("cash")} className="iconbtn" style={{ flex: 1, padding: "8px 0", borderRadius: 10, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 13 }}>
          💰 현금계좌
        </button>
        <button onClick={() => setMainView("view")} className="iconbtn" style={{ flex: 1, padding: "8px 0", borderRadius: 10, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 13 }}>
          👁 보기
        </button>
        <button onClick={() => setMainView("settings")} className="iconbtn" style={{ flex: 1, padding: "8px 0", borderRadius: 10, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 13 }}>
          ⚙ 설정
        </button>
      </div>

      <div style={{ padding: "0 16px 14px", display: "flex", gap: 6 }}>
        <button
          onClick={() => { setStrengthPeriod("W"); setMainView("strengthChart"); }}
          className="iconbtn"
          style={{ flex: 1, padding: "8px 4px", borderRadius: 10, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 13, whiteSpace: "nowrap" }}
        >
          📊 강약챠트
        </button>
        <button
          onClick={() => { setComparePeriod("W"); setMainView("compareChart"); }}
          className="iconbtn"
          style={{ flex: 1, padding: "8px 4px", borderRadius: 10, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 13, whiteSpace: "nowrap" }}
        >
          📉 챠트비교
        </button>
        <button
          onClick={() => { setFundSelected(null); setChartTab("eps"); setMainView("chart"); }}
          className="iconbtn"
          style={{ flex: 1, padding: "8px 4px", borderRadius: 10, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 13, whiteSpace: "nowrap" }}
        >
          📈 종목챠트
        </button>
        <button
          onClick={() => { setSectorSelected(null); setMainView("sectorChart"); }}
          className="iconbtn"
          style={{ flex: 1, padding: "8px 4px", borderRadius: 10, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 13, whiteSpace: "nowrap" }}
        >
          🏭 업종챠트
        </button>
      </div>
      </>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PortfolioApp />);
</script>
<script>
// 위 <script id="app-source">는 type="text/plain"이라 브라우저가 자동 실행하지 않는다.
// 여기서 직접 Babel로 변환하고 실행해서, 오류가 나면 "Script error."로 뭉개지지 않고 진짜 원인이 화면에 보이게 한다.
(function () {
  try {
    var src = document.getElementById('app-source').textContent;
    var out = Babel.transform(src, { presets: ['react'], filename: 'app.jsx' }).code;
    try {
      (0, eval)(out);
    } catch (runErr) {
      window.__showFatalError('앱 실행 중 오류\n\n' + ((runErr && runErr.stack) ? runErr.stack : String(runErr)));
    }
  } catch (compileErr) {
    window.__showFatalError('코드 변환(문법) 오류\n\n' + (compileErr && compileErr.message ? compileErr.message : String(compileErr)));
  }
})();
</script>
</body>
</html>
