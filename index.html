<script>
(function () {
  function isLockOn() {
    try { return !!localStorage.getItem('portfolio-lock-credential-v1'); } catch (e) { return false; }
  }
  function show() {
    if (!isLockOn()) return;
    var el = document.getElementById('privacy-shield');
    if (el) el.style.display = 'flex';
  }
  function hide() {
    var el = document.getElementById('privacy-shield');
    if (el) el.style.display = 'none';
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) show(); else hide();
  });
  window.addEventListener('pagehide', show);
  window.addEventListener('blur', show);
  window.addEventListener('focus', hide);
})();
</script>
<script>
// 화면이 하얗게/까맣게 비어버릴 때, 원인 오류를 화면에 직접 보여준다 (아이폰에서는 콘솔을 보기 어려우므로).
(function () {
  function showError(msg) {
    var box = document.getElementById('fatal-error-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'fatal-error-box';
      box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#2a0f0f;color:#ffb4ae;font:12px/1.5 -apple-system,sans-serif;padding:14px 34px 14px 14px;white-space:pre-wrap;word-break:break-word;max-height:70vh;overflow:auto;border-bottom:2px solid #e8544b;';
      var text = document.createElement('div');
      text.id = 'fatal-error-text';
      var close = document.createElement('button');
      close.textContent = '✕';
      close.style.cssText = 'position:absolute;top:8px;right:10px;background:none;border:none;color:#ffb4ae;font-size:16px;padding:4px;';
      close.onclick = function () { box.remove(); };
      box.appendChild(text);
      box.appendChild(close);
      document.body.appendChild(box);
    }
    document.getElementById('fatal-error-text').textContent = '⚠️ 오류가 발생했어요 (이 내용을 캡처해서 보내주세요)\n\n' + msg;
  }
  window.__showFatalError = showError;
  window.addEventListener('error', function (e) {
    var stack = (e.error && e.error.stack) ? e.error.stack : '';
    showError((e.message || '알 수 없는 오류') + '\n' + (e.filename || '') + ' : ' + (e.lineno || '') + '행' + (stack ? ('\n\n스택:\n' + stack) : '\n\n(스택 정보 없음 - Babel 실행 중 오류일 수 있음)'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showError('Promise 오류: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
  });
  // 5초 안에 앱이 하나도 안 그려졌으면(=조용히 죽었으면) 알려준다.
  setTimeout(function () {
    var root = document.getElementById('root');
    if (root && root.children.length === 0 && !document.getElementById('fatal-error-box')) {
      showError('앱이 렌더링되지 않았어요. 화면을 아래로 당겨 새로고침하거나, 브라우저 캐시를 지운 뒤 다시 시도해 보세요.\n(캐시 문제라면 주소 끝에 ?v=2 를 붙여서 열면 확인됩니다)');
    }
  }, 5000);
})();

// ---------- helpers ----------
const num = (v) => {
  // 아이폰 스마트 대시 등으로 인해 –(en dash), —(em dash), −(minus sign) 등으로 바뀐 경우도 전부 표준 "-"로 취급
  const normalized = typeof v === "string" ? v.replace(/[\u2010-\u2015\u2212]/g, "-") : v;
  const n = parseFloat(normalized);
  return isNaN(n) ? 0 : n;
};
const sum = (arr) => arr.reduce((a, b) => a + (b || 0), 0);
const fmt = (n) => (n === null || n === undefined || isNaN(n)) ? "-" : Math.round(n).toLocaleString("ko-KR");
const fmtPct = (n) => (n === null || n === undefined || isNaN(n)) ? "-" : (n * 100).toFixed(1) + "%";

const toDisplay = (v) => {
  if (v === "" || v === undefined || v === null) return "";
  // 아이폰 스마트 대시로 바뀐 –, —, − 등도 미리 표준 "-"로 바꿔준 다음 정리
  const normalized = String(v).replace(/[\u2010-\u2015\u2212]/g, "-");
  const cleaned = normalized.replace(/[^0-9.-]/g, "");
  if (cleaned === "" || cleaned === "-") return cleaned;
  const n = Number(cleaned);
  if (isNaN(n)) return "";
  return n.toLocaleString("ko-KR", { maximumFractionDigits: 4 });
};
const fromDisplay = (v) => v.replace(/,/g, "");

function bufToBase64url(buf) {
  const bytes = new Uint8Array(buf);
  let str = "";
  for (let i = 0; i < bytes.length; i++) str += String.fromCharCode(bytes[i]);
  return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function base64urlToBuf(b64url) {
  const b64 = b64url.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((b64url.length + 3) % 4);
  const str = atob(b64);
  const bytes = new Uint8Array(str.length);
  for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
  return bytes.buffer;
}
function randomBytes(len) {
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return arr;
}

function rankDesc(arr) {
  const valid = arr.map((v, i) => ({ v, i })).filter((x) => x.v !== null && x.v !== undefined && !isNaN(x.v));
  const sorted = [...valid].sort((a, b) => b.v - a.v);
  const ranks = new Array(arr.length).fill(null);
  sorted.forEach((item, idx) => {
    if (idx > 0 && sorted[idx].v === sorted[idx - 1].v) ranks[item.i] = ranks[sorted[idx - 1].i];
    else ranks[item.i] = idx + 1;
  });
  return ranks;
}

  const stockCalc = useMemo(() => {
    const base = stocks.map((s) => {
      const qty = num(s.qty), buy = num(s.buyPrice), cur = num(s.curPrice);
      const vSellQty = num(s.virtualSellQty), vBuyQty = num(s.virtualBuyQty);
      const vsell = vBuyQty - vSellQty; // 순 가상 수량 변화 (매수 +, 매도 -)
      const prevClose = num(s.prevClose);
      const hasName = s.name && s.name.trim() !== "";
      const effQty = qty + vsell;
      const investAmt = hasName ? buy * effQty : 0;
      const valAmt = hasName ? cur * effQty : 0;
      const pnl = hasName ? (cur - buy) * effQty : 0;
      const returnRate = hasName && buy * qty !== 0 ? pnl / (buy * qty) : null;
      const hasPrevClose = hasName && prevClose !== 0;
      const prevChangeAmt = hasPrevClose ? cur - prevClose : null;
      const prevChangeRate = hasPrevClose ? (cur - prevClose) / prevClose : null;
      const vSellCash = cur * vSellQty; // 가상 매도로 들어오는 현금
      const vBuyCash = cur * vBuyQty;   // 가상 매수로 나가는 현금
      const vCashImpact = vSellCash - vBuyCash; // 순 현금 변화 (+면 현금 증가)
      return { ...s, hasName, qty, buy, cur, vsell, vSellQty, vBuyQty, vSellCash, vBuyCash, vCashImpact, prevClose, hasPrevClose, prevChangeAmt, prevChangeRate, effQty, investAmt, valAmt, pnl, returnRate };
    });
    const totalInvest = sum(base.map((r) => r.investAmt));
    const realTotalInvest = sum(base.map((r) => (r.hasName ? r.buy * r.qty : 0))); // 가상매수/매도 제외한 진짜 매입원가 (baseline 판단용)
    const totalVal = sum(base.map((r) => r.valAmt));
    const withWeights = base.map((r) => {
      const profitWeight = r.hasName && totalVal + totalInvest !== 0 ? (r.valAmt + r.investAmt) / (totalVal + totalInvest) : null;
      const purchaseWeight = r.hasName && totalInvest !== 0 ? r.investAmt / totalInvest : null;
      return { ...r, profitWeight, purchaseWeight };
    });
    const profitRanks = rankDesc(withWeights.map((r) => r.profitWeight));
    const purchaseRanks = rankDesc(withWeights.map((r) => r.purchaseWeight));
    const withRanks = withWeights.map((r, i) => ({ ...r, profitRank: profitRanks[i], purchaseRank: purchaseRanks[i] }));
    const withAvg = withRanks.map((r) => {
      const avgWeight = r.profitWeight !== null && r.purchaseWeight !== null ? (r.profitWeight + r.purchaseWeight) / 2 : null;
      const diffWeight = r.profitWeight !== null && r.purchaseWeight !== null ? r.profitWeight - r.purchaseWeight : null;
      return { ...r, avgWeight, diffWeight };
    });
    const avgRanks = rankDesc(withAvg.map((r) => r.avgWeight));
    const rows = withAvg.map((r, i) => ({ ...r, avgRank: avgRanks[i] }));
    const top4Profit = sum(rows.filter((r) => r.profitRank && r.profitRank <= 4).map((r) => r.profitWeight || 0));
    const top4Purchase = sum(rows.filter((r) => r.purchaseRank && r.purchaseRank <= 4).map((r) => r.purchaseWeight || 0));
    const top4Avg = sum(rows.filter((r) => r.avgRank && r.avgRank <= 4).map((r) => r.avgWeight || 0));
    const maxWeight = Math.max(0, ...rows.map((r) => r.purchaseWeight || 0));
    return { rows, totalInvest, realTotalInvest, totalVal, top4Profit, top4Purchase, top4Avg, maxWeight };
  }, [stocks]);

  // 종목의 업종명은 이제 가격 갱신할 때 한투 API가 같이 내려주는 값(r.industryName)을 그대로 쓴다.
  // (예전엔 네이버를 따로 스크래핑했는데, 한투 API 응답 안에 이미 업종명이 있어서 그걸로 대체함 — 더 정확하고 빠름)

  // 한투 업종명 ↔ 우리 SECTOR_GROUPS 업종명 을 느슨하게(부분일치) 매칭해서 연결해준다.
  // (한투 종목 조회는 점(.)으로 구분("전기.전자"), 업종지수 목록은 가운뎃점(·)으로 구분("전기·전자") — 구분자 차이만 있고 같은 체계라 매칭이 잘 된다)
  const matchSectorGroup = useCallback((industryName) => {
    if (!industryName) return null;
    const clean = industryName.replace(/[·./,\s]/g, "");
    for (const [marketKey, group] of Object.entries(SECTOR_GROUPS)) {
      for (const sector of group.list) {
        const sClean = sector.name.replace(/[·./,\s]/g, "");
        if (clean === sClean || clean.includes(sClean) || sClean.includes(clean)) {
          return { sectorName: sector.name, marketLabel: group.label, marketKey, code: sector.code };
        }
      }
    }
    return null;
  }, []);

  // 현재 보유 중인 종목들의 업종이 매칭되는 (market, code) 조합 집합 — 업종 목록의 📌 표시용
  const heldSectorKeys = useMemo(() => {
    const set = new Set();
    stocks.forEach((s) => {
      if (!s.name) return;
      const matched = matchSectorGroup(s.industryName);
      if (matched) set.add(matched.marketKey + ":" + matched.code);
    });
    return set;
  }, [stocks, matchSectorGroup]);

  const cashCalc = useMemo(() => {
    const rows = cashAccounts.map((a) => {
      const cash = num(a.cash), pledged = num(a.pledged), used = num(a.used);
      return { ...a, cash, pledged, used, total: cash + pledged - used };
    });
    return {
      rows,
      totalCash: sum(rows.map((r) => r.cash)),
      totalPledged: sum(rows.map((r) => r.pledged)),
      totalUsed: sum(rows.map((r) => r.used)),
      totalAccountValue: sum(rows.map((r) => r.total)),
    };
  }, [cashAccounts]);

  const S2 = sum(stocks.map((s) => num(s.curPrice) * (num(s.virtualBuyQty) - num(s.virtualSellQty))));
  const realAvailableCash = cashCalc.totalCash - S2;
  // 평가총금액 = 주식투자평가액 + 실제보유현금합계 (가상매수/매도 시뮬레이션과 무관하게 항상 실제 값 기준)
  const totalPortfolioValue = stockCalc.totalVal + cashCalc.totalCash;
  const cashRatio = totalPortfolioValue !== 0 ? realAvailableCash / totalPortfolioValue : 0;
  const investableCash = totalPortfolioValue * (cashRatio - targetCashRatio);
  // 주식 매입원가와 현금 둘 다 baseline(한 번 오른 뒤엔 절대 안 내려가는 값)을 사용
  // 투자금은 오직 "현금계좌의 사용한 돈" 정산을 통해서만 줄어들 수 있고, 그 외에는 절대 안 줄어든다
  // "주식투자금"은 이제 baseline 없이 항상 지금 실제 보유수량 기준 값을 그대로 쓴다 — 계속 사고팔며 비중조절하는 게 정상이라 자유롭게 오르내려야 함
  // "투자원금"은 주식/현금 공식과 완전히 분리된 독립 값이다.
  //   - 오직 "사용한돈" 정산으로만 줄어들 수 있고, 그 내역은 기록으로 남는다.
  //   - 늘리거나 고칠 땐 사용자가 직접 입력해서 적용한다 (자동으로 오르지 않음).
  const investmentPrincipal = investmentPrincipalBase;
  const totalReturnAmt = totalPortfolioValue - investmentPrincipal;
  const totalReturnRate = investmentPrincipal !== 0 ? totalReturnAmt / investmentPrincipal : null;

  // 전날(가장 최근 보관된, 오늘이 아닌 날짜) 대비 수익률 — "현재날짜로보관" 스냅샷에 저장된 그날의 주가로 계산
  const yesterdayCalc = useMemo(() => {
    const todayStr = new Date().toISOString().slice(0, 10);
    const prevSnap = snapshots.find((s) => (s.savedAt || "").slice(0, 10) !== todayStr);
    if (!prevSnap) return null;
    const yStockVal = sum((prevSnap.stocks || []).map((s) => {
      const hasName = s.name && s.name.trim() !== "";
      return hasName ? num(s.curPrice) * num(s.qty) : 0;
    }));
    const stockDiff = stockCalc.totalVal - yStockVal;
    const stockDiffRate = yStockVal !== 0 ? stockDiff / yStockVal : null;
    return { date: (prevSnap.savedAt || "").slice(0, 10), yStockVal, stockDiff, stockDiffRate };
  }, [snapshots, stockCalc.totalVal]);

  // 최초 1회: 투자원금이 아직 한 번도 설정된 적 없으면(0이면), 지금 실제 주식투자금+보유현금 합계로 시작값을 잡아준다.
  useEffect(() => {
    if (!loaded) return;
    try {
      if (localStorage.getItem(INVESTMENT_PRINCIPAL_KEY)) return; // 이미 설정된 적 있음
    } catch (e) {}
    const startValue = stockCalc.totalInvest + cashCalc.totalCash + sum(cashAccounts.map((a) => num(a.pledged)));
    if (startValue > 0) {
      setInvestmentPrincipalBase(startValue);
      try { localStorage.setItem(INVESTMENT_PRINCIPAL_KEY, String(startValue)); } catch (e) {}
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded]);

  // 사용자가 "투자원금"을 직접 입력하면 그 값으로 바로 설정한다 (주식/현금 공식과 무관한 독립값이므로).
  const applyPrincipalOverride = () => {
    const newValue = num(fromDisplay(principalOverrideInput));
    if (!principalOverrideInput || newValue <= 0) {
      setLockMsg("❌ 적용할 금액을 입력해주세요.");
      setTimeout(() => setLockMsg(""), 3000);
      return;
    }
    if (!window.confirm(`투자원금을 ${fmt(newValue)}원으로 적용할까요?\n(현재: ${fmt(investmentPrincipalBase)}원)`)) return;
    setInvestmentPrincipalBase(newValue);
    try { localStorage.setItem(INVESTMENT_PRINCIPAL_KEY, String(newValue)); } catch (e) {}
    setPrincipalOverrideInput("");
    setLockMsg(`✅ 투자원금을 ${fmt(newValue)}원으로 적용했어요.`);
    setTimeout(() => setLockMsg(""), 3000);
  };


  // 비중평균(avgWeight) 내림차순 정렬 — 단, 값이 바뀔 때마다 바로 재정렬하지 않고
  // 종목 추가/삭제/불러오기 시, 그리고 "실시간 시세 새로고침" 실행 시에만 순서를 다시 계산한다.
  const [stockOrder, setStockOrder] = useState([]);
  const recomputeStockOrder = () => {
    const order = [...stockCalc.rows]
      .sort((a, b) => {
        if (a.avgWeight === null && b.avgWeight === null) return 0;
        if (a.avgWeight === null) return 1;
        if (b.avgWeight === null) return -1;
        return b.avgWeight - a.avgWeight;
      })
      .map((r) => r.id);
    setStockOrder(order);
  };
  const stockIdsKey = stocks.map((s) => s.id).join(",");
  useEffect(() => {
    recomputeStockOrder();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [stockIdsKey]);

  const sortedStockRows = useMemo(() => {
    const byId = {};
    stockCalc.rows.forEach((r) => { byId[r.id] = r; });
    const ordered = stockOrder.map((id) => byId[id]).filter(Boolean);
    const missing = stockCalc.rows.filter((r) => !stockOrder.includes(r.id));
    return [...ordered, ...missing];
  }, [stockCalc.rows, stockOrder]);

  // 사용자가 수동으로 순서를 정할 수 있도록 cashAccounts 배열 순서 그대로 사용 (자동 정렬 없음)
  const sortedCashRows = cashCalc.rows;

  const logRebalanceEvent = (name, qty, buyPrice, direction) => {
    const todayStr = new Date().toISOString().slice(0, 10);
    setRebalanceLog((prev) => {
      const idx = prev.findIndex((g) => g.date === todayStr);
      let next;
      if (idx === -1) {
        next = [...prev, { date: todayStr, items: [{ name, qty, buyPrice, direction }] }];
      } else {
        const group = prev[idx];
        const itemIdx = group.items.findIndex((it) => it.name === name);
        const newItems = itemIdx === -1
          ? [...group.items, { name, qty, buyPrice, direction }]
          : group.items.map((it, i) => (i === itemIdx ? { ...it, name, qty, buyPrice, direction: direction || it.direction } : it));
        next = prev.map((g, i) => (i === idx ? { ...group, items: newItems } : g));
      }
      try { localStorage.setItem(REBALANCE_LOG_KEY, JSON.stringify(next)); } catch (e) {}
      return next;
    });
  };
  const deleteRebalanceEntry = (date) => {
    setRebalanceLog((prev) => {
      const next = prev.filter((g) => g.date !== date);
      try { localStorage.setItem(REBALANCE_LOG_KEY, JSON.stringify(next)); } catch (e) {}
      return next;
    });
  };
  const deleteRebalanceItem = (date, name) => {
    setRebalanceLog((prev) => {
      const next = prev
        .map((g) => (g.date === date ? { ...g, items: g.items.filter((it) => it.name !== name) } : g))
        .filter((g) => g.date !== date || g.items.length > 0);
      try { localStorage.setItem(REBALANCE_LOG_KEY, JSON.stringify(next)); } catch (e) {}
      return next;
    });
  };
  const qtyFocusRef = useRef({}); // { [stockId]: 포커스 들어올 때의 qty 값 } — 타이핑 중간값이 아니라 최종값끼리만 비교하기 위함
  const handleQtyFocus = (id, qty) => { qtyFocusRef.current[id] = num(qty); };
  const handleQtyBlur = (id) => {
    delete qtyFocusRef.current[id];
  };

  // "빌려투자한돈"이 늘면 투자원금도 늘고, 줄면(갚으면) 투자원금도 같이 줄어들며 이력에 기록된다.
  const pledgedFocusRef = useRef({});
  const handlePledgedFocus = (id, pledged) => { pledgedFocusRef.current[id] = num(pledged); };
  const handlePledgedBlur = (id) => {
    const before = pledgedFocusRef.current[id];
    if (before === undefined) { delete pledgedFocusRef.current[id]; return; }
    const account = cashAccounts.find((a) => a.id === id);
    if (account) {
      const after = num(account.pledged);
      if (after !== before) {
        const diff = after - before; // 양수면 증가, 음수면 감소(상환)
        setInvestmentPrincipalBase((prev) => {
          const next = Math.max(0, prev + diff);
          try { localStorage.setItem(INVESTMENT_PRINCIPAL_KEY, String(next)); } catch (e) {}
          return next;
        });
        const entry = {
          id: genId(),
          date: new Date().toISOString().slice(0, 10),
          time: new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }),
          accountId: id,
          accountName: account.name || "(이름없음)",
          amount: Math.abs(diff),
          cashBefore: before,
          cashAfter: after,
          type: diff > 0 ? "borrow" : "repay",
        };
        setCashSettleLog((prev) => {
          const next = [entry, ...prev];
          try { localStorage.setItem(CASH_SETTLE_LOG_KEY, JSON.stringify(next)); } catch (e) {}
          return next;
        });
      }
    }
    delete pledgedFocusRef.current[id];
  };

  // "이자" — 빌려투자한돈(pledged) 원금에 대해 연 10%, 매일 일할 계산해서 자동으로 쌓인다.
  // 앱을 며칠 만에 열어도 마지막 계산일부터 오늘까지 경과 일수만큼 한 번에 계산해서 따라잡는다.
  useEffect(() => {
    if (!loaded) return;
    const todayStr = new Date().toISOString().slice(0, 10);
    setCashAccounts((prev) => {
      let changed = false;
      const next = prev.map((a) => {
        const lastDate = a.interestDate || todayStr; // 처음 보는 계좌면 오늘부터 계산 시작 (과거로 소급 안 함)
        if (lastDate === todayStr) return a;
        const daysElapsed = Math.floor((new Date(todayStr) - new Date(lastDate)) / 86400000);
        if (daysElapsed <= 0) return a;
        changed = true;
        const principal = num(a.pledged);
        const dailyRate = 0.10 / 365;
        const accrued = principal * dailyRate * daysElapsed;
        return { ...a, interest: String(num(a.interest) + accrued), interestDate: todayStr };
      });
      return changed ? next : prev;
    });
  }, [loaded]);

  // "이자" 칸은 자동 계산으로만 늘어나야 한다 — 직접 줄이면(=이자를 받으면) 그만큼 현금이 늘어나지만,
  // 직접 늘리는 건 막고 원래 값으로 되돌린다.
  const interestFocusRef = useRef({});
  const handleInterestFocus = (id, interest) => { interestFocusRef.current[id] = num(interest); };
  const handleInterestBlur = (id) => {
    const before = interestFocusRef.current[id];
    if (before === undefined) { delete interestFocusRef.current[id]; return; }
    const account = cashAccounts.find((a) => a.id === id);
    if (account) {
      const after = num(account.interest);
      const diff = after - before; // 음수면 이자를 받아서 줄인 것, 양수면 수동으로 늘리려 한 것(허용 안 함)
      if (diff < 0) {
        const collected = -diff;
        // 이자를 받으면: 보조투자계좌 현금은 늘고, 그 이자를 낸 주투자계좌(1번 계좌) 현금은 똑같이 줄어든다.
        const mainAccountId = cashAccounts[0] ? cashAccounts[0].id : null;
        setCashAccounts((prev) => prev.map((a) => {
          if (a.id === id) return { ...a, cash: String(num(a.cash) + collected) };
          if (mainAccountId && a.id === mainAccountId && a.id !== id) return { ...a, cash: String(num(a.cash) - collected) };
          return a;
        }));
      } else if (diff > 0) {
        // 수동으로 늘리는 건 막고 원래 값으로 되돌린다.
        setCashAccounts((prev) => prev.map((a) => (a.id === id ? { ...a, interest: String(before) } : a)));
      }
    }
    delete interestFocusRef.current[id];
  };

  // "이자" 칸은 수동으로는 줄일 수만 있고(=이자를 받았다는 뜻), 늘릴 수는 없다 (자동 계산만 늘어나야 함).
  const updateInterestCapped = (id, rawValue) => {
    setCashAccounts((prev) => prev.map((a) => {
      if (a.id !== id) return a;
      const focusVal = interestFocusRef.current[id];
      const cap = focusVal !== undefined ? focusVal : num(a.interest);
      const typed = num(rawValue);
      const clamped = typed > cap ? cap : typed;
      // 입력칸에는 사용자가 타이핑한 형태를 그대로 보여주되, 만약 상한을 넘겼다면 상한값 문자열로 강제 교정한다.
      return { ...a, interest: typed > cap ? String(clamped) : rawValue };
    }));
  };

  const updateStock = (id, field, value) => {
    setStocks((prev) => prev.map((s) => (s.id === id ? { ...s, [field]: value } : s)));
    if (field === "qty" || field === "buyPrice") {
      const current = stocks.find((s) => s.id === id);
      if (current) {
        const displayName = current.name && current.name.trim() !== "" ? current.name : "(이름없음)";
        const loggedQty = field === "qty" ? value : current.qty;
        const loggedBuy = field === "buyPrice" ? value : current.buyPrice;
        let direction = null;
        if (field === "qty") {
          const before = num(current.qty), after = num(value);
          if (after > before) direction = "buy";
          else if (after < before) direction = "sell";
        }
        logRebalanceEvent(displayName, loggedQty, loggedBuy, direction);
      }
    }
  };

  // 리밸런싱 이력의 개별 종목 항목을 직접 수정한다 (종목명/수량/매수·매도 구분)
  const updateRebalanceItem = (date, oldName, field, value) => {
    setRebalanceLog((prev) => {
      const next = prev.map((g) => {
        if (g.date !== date) return g;
        return { ...g, items: g.items.map((it) => (it.name === oldName ? { ...it, [field]: value } : it)) };
      });
      try { localStorage.setItem(REBALANCE_LOG_KEY, JSON.stringify(next)); } catch (e) {}
      return next;
    });
  };
  // 리밸런싱 이력 표시용 계산 (최근 30회차 + 전체 평균 주기)
  const rebalanceDisplay = useMemo(() => {
    const log = rebalanceLog;
    const dayMs = 24 * 60 * 60 * 1000;
    const withIntervals = log.map((g, idx) => {
      const interval = idx === 0 ? null : Math.round((new Date(g.date) - new Date(log[idx - 1].date)) / dayMs);
      return { ...g, interval };
    });
    const allIntervals = withIntervals.slice(1).map((r) => r.interval);
    const avgIntervalAll = allIntervals.length > 0 ? allIntervals.reduce((a, b) => a + b, 0) / allIntervals.length : null;
    const last30 = withIntervals.slice(-30).reverse(); // 최신 회차가 위로
    return { last30, avgIntervalAll, totalCount: log.length };
  }, [rebalanceLog]);


  const updateStockName = (id, name) => {
    setStocks((prev) => prev.map((s) => {
      if (s.id !== id) return s;
      const exact = findExactCode(name);
      return exact ? { ...s, name, code: exact } : { ...s, name };
    }));
  };
  const pickSuggestion = (id, name, code) => {
    setStocks((prev) => prev.map((s) => (s.id === id ? { ...s, name, code } : s)));
    setSuggestFor(null);
  };
  const addStock = () => setStocks((prev) => [...prev, emptyStock()]);
  const removeStock = (id) => setStocks((prev) => prev.filter((s) => s.id !== id));
  const updateCash = (id, field, value) => setCashAccounts((prev) => prev.map((a) => (a.id === id ? { ...a, [field]: value } : a)));
  const addCash = () => setCashAccounts((prev) => [...prev, emptyCash()]);
  const removeCash = (id) => setCashAccounts((prev) => prev.filter((a) => a.id !== id));

  const deleteCashSettleEntry = (id) => {
    setCashSettleLog((prev) => {
      const entry = prev.find((e) => e.id === id);
      if (entry) {
        // 이 기록이 투자원금에 줬던 원래 효과(originalDelta)를 계산해서, 그 반대로 되돌린다.
        let originalDelta;
        if (entry.type === "spend" || entry.type === "invest") originalDelta = entry.amount; // 부호 있는 값 그대로
        else if (entry.type === "borrow") originalDelta = entry.amount; // 증가
        else originalDelta = -entry.amount; // "repay" 또는 예전 형식(사용한돈 정산) → 감소였음
        const reverseDelta = -originalDelta;
        setInvestmentPrincipalBase((prevBase) => {
          const nextBase = Math.max(0, prevBase + reverseDelta);
          try { localStorage.setItem(INVESTMENT_PRINCIPAL_KEY, String(nextBase)); } catch (e) {}
          return nextBase;
        });
        // "사용한돈/투자한돈"(spend·invest)은 "현금"과 "빌려투자한돈"이 같은 방향, "상환한돈/대출한돈"(repay·borrow, 새 버튼 방식)은 "현금"과 "빌려투자한돈"이 반대 방향으로 바뀌었던 거라, 그 부분도 같이 되돌린다.
        // (예전 방식의 "빌려투자한돈" 직접수정 기록은 pledgedBefore가 없고 cash를 바꾼 적이 없으므로 여기서 제외한다)
        const isNewLoanEntry = (entry.type === "borrow" || entry.type === "repay") && entry.pledgedBefore !== undefined;
        if (entry.accountId && (entry.type === "spend" || entry.type === "invest")) {
          setCashAccounts((prevAccounts) => prevAccounts.map((a) =>
            a.id === entry.accountId ? { ...a, cash: String(num(a.cash) + reverseDelta) } : a
          ));
        }
        if (entry.accountId && isNewLoanEntry) {
          setCashAccounts((prevAccounts) => prevAccounts.map((a) =>
            a.id === entry.accountId ? { ...a, cash: String(num(a.cash) - reverseDelta) } : a
          ));
        }
        // "빌려투자한돈"(borrow·repay)은 새/구 방식 모두 되돌린다.
        if ((entry.type === "borrow" || entry.type === "repay") && entry.accountId) {
          setCashAccounts((prevAccounts) => prevAccounts.map((a) =>
            a.id === entry.accountId ? { ...a, pledged: String(Math.max(0, num(a.pledged) + reverseDelta)) } : a
          ));
        }
      }
      const next = prev.filter((e) => e.id !== id);
      try { localStorage.setItem(CASH_SETTLE_LOG_KEY, JSON.stringify(next)); } catch (e) {}
      return next;
    });
  };

  // "사용한돈/투자한돈": 금액을 입력한 뒤 "➖ 사용" 또는 "➕ 투자" 버튼을 누르면 그 즉시 적용된다.
  const applyUsedAmount = (id, sign) => {
    const account = cashAccounts.find((a) => a.id === id);
    if (!account) return;
    const magnitude = Math.abs(num(account.used));
    if (magnitude === 0) return;
    const amount = sign === "spend" ? -magnitude : magnitude; // 사용=음수(차감), 투자=양수(증가)
    const cashBefore = num(account.cash);
    const cashAfter = cashBefore + amount;
    setCashAccounts((prev) => prev.map((a) => (a.id === id ? { ...a, cash: String(cashAfter), used: "" } : a)));
    setInvestmentPrincipalBase((prev) => {
      const next = Math.max(0, prev + amount);
      try { localStorage.setItem(INVESTMENT_PRINCIPAL_KEY, String(next)); } catch (e) {}
      return next;
    });
    const entry = {
      id: genId(),
      date: new Date().toISOString().slice(0, 10),
      time: new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }),
      accountId: account.id,
      accountName: account.name || "(이름없음)",
      amount, // 부호 있는 값 그대로 저장 (음수=사용한돈, 양수=투자한돈)
      cashBefore, cashAfter,
      type: amount < 0 ? "spend" : "invest",
    };
    setCashSettleLog((prev) => {
      const next = [entry, ...prev];
      try { localStorage.setItem(CASH_SETTLE_LOG_KEY, JSON.stringify(next)); } catch (e) {}
      return next;
    });
  };

  // "상환한돈/대출한돈" — 대출하면 보조계좌 현금이 빠져나가고 빌려투자한돈이 늘며,
  // 상환하면 반대로 현금이 들어오고 빌려투자한돈이 준다 (현금과 빌려투자한돈은 항상 반대 방향으로 움직인다).
  const applyPledgedAmount = (id, sign) => {
    const account = cashAccounts.find((a) => a.id === id);
    if (!account) return;
    const magnitude = Math.abs(num(account.repayLoan));
    if (magnitude === 0) return;
    const pledgedDelta = sign === "repay" ? -magnitude : magnitude; // 대출=빌려투자한돈 증가, 상환=감소
    const cashDelta = -pledgedDelta; // 빌려투자한돈과 반대 방향
    const cashBefore = num(account.cash);
    const cashAfter = cashBefore + cashDelta;
    const pledgedBefore = num(account.pledged);
    const pledgedAfter = Math.max(0, pledgedBefore + pledgedDelta);
    setCashAccounts((prev) => prev.map((a) => (a.id === id ? { ...a, cash: String(cashAfter), pledged: String(pledgedAfter), repayLoan: "" } : a)));
    setInvestmentPrincipalBase((prev) => {
      const next = Math.max(0, prev + pledgedDelta);
      try { localStorage.setItem(INVESTMENT_PRINCIPAL_KEY, String(next)); } catch (e) {}
      return next;
    });
    const entry = {
      id: genId(),
      date: new Date().toISOString().slice(0, 10),
      time: new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }),
      accountId: account.id,
      accountName: account.name || "(이름없음)",
      amount: magnitude, // 절대값으로 저장 (부호는 type으로 구분 — 예전 방식과 같은 컨벤션, 삭제-되돌리기 로직과 호환)
      cashBefore, cashAfter,
      pledgedBefore, pledgedAfter,
      type: pledgedDelta < 0 ? "repay" : "borrow",
    };
    setCashSettleLog((prev) => {
      const next = [entry, ...prev];
      try { localStorage.setItem(CASH_SETTLE_LOG_KEY, JSON.stringify(next)); } catch (e) {}
      return next;
    });
  };


  const moveCash = (id, dir) => {
    setCashAccounts((prev) => {
      const idx = prev.findIndex((a) => a.id === id);
      const swapIdx = idx + dir;
      if (idx < 0 || swapIdx < 0 || swapIdx >= prev.length) return prev;
      // 1번 카드(현금·주투자계좌)는 항상 맨 위에 고정 — 자기 자신도 못 움직이고, 다른 카드도 그 자리로 못 들어옴
      if (idx === 0 || swapIdx === 0) return prev;
      const next = [...prev];
      [next[idx], next[swapIdx]] = [next[swapIdx], next[idx]];
      return next;
    });
  };

  const refreshPrices = useCallback(async () => {
    if (!proxyUrl) { setRefreshMsg("먼저 설정에서 프록시 서버 주소를 입력하세요."); return; }
    setRefreshing(true); setRefreshMsg("");
    const base = proxyUrl.replace(/\/$/, "");
    const headers = appSecret ? { "x-app-secret": appSecret } : {};
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    const fetchOneStock = async (s, i) => {
      if (!s.code || !s.name) return { i, skip: true };
      try {
        const res = await fetch(`${base}/price/${s.code}`, { headers });
        if (!res.ok) throw new Error("bad response");
        const data = await res.json();
        if (data && data.price) {
          return { i, ok: true, curPrice: String(data.price), prevClose: data.prevClose ? String(data.prevClose) : undefined, industryName: data.industryName || undefined };
        }
        return { i, ok: false };
      } catch (e) {
        return { i, ok: false };
      }
    };
    const fetchIndex = (code) => fetch(`${base}/index/${code}`, { headers }).then((r) => (r.ok ? r.json() : null)).catch(() => null);

    // 실패한 항목(종목/지수)만 최대 3번까지 자동으로 재시도
    let indicesToTry = stocks.map((_, i) => i);
    const stockResultMap = {};
    let kospiData = null, kosdaqData = null;
    let needKospi = true, needKosdaq = true;
    let attempt = 0;
    const maxRetries = 3;

    while (attempt <= maxRetries) {
      const [stockResults, kospiRes, kosdaqRes] = await Promise.all([
        Promise.all(indicesToTry.map((i) => fetchOneStock(stocks[i], i))),
        needKospi ? fetchIndex("0001") : Promise.resolve(null),
        needKosdaq ? fetchIndex("1001") : Promise.resolve(null),
      ]);
      stockResults.forEach((r) => { stockResultMap[r.i] = r; });
      if (needKospi && kospiRes && kospiRes.price) { kospiData = kospiRes; needKospi = false; }
      if (needKosdaq && kosdaqRes && kosdaqRes.price) { kosdaqData = kosdaqRes; needKosdaq = false; }

      indicesToTry = indicesToTry.filter((i) => stockResultMap[i] && !stockResultMap[i].skip && !stockResultMap[i].ok);
      const stillFailing = indicesToTry.length > 0 || needKospi || needKosdaq;
      attempt++;
      if (!stillFailing || attempt > maxRetries) break;
      setRefreshMsg(`일부 실패, 재시도 중... (${attempt}/${maxRetries})`);
      await sleep(1500);
    }

    let okCount = 0, failCount = 0;
    const updated = [...stocks];
    Object.values(stockResultMap).forEach((r) => {
      if (r.skip) return;
      if (r.ok) {
        updated[r.i] = { ...updated[r.i], curPrice: r.curPrice, ...(r.prevClose ? { prevClose: r.prevClose } : {}), ...(r.industryName ? { industryName: r.industryName } : {}) };
        okCount++;
      } else {
        failCount++;
      }
    });

    setStocks(updated); setRefreshing(false);
    setRefreshMsg(`완료: ${okCount}개 갱신${failCount ? `, ${failCount}개 실패(3회 재시도 후에도 실패)` : ""}`);
    setLastRefreshedAt(new Date());
    setPriceRefreshTick((t) => t + 1);
    setMarketIndices({ kospi: kospiData, kosdaq: kosdaqData });
  }, [proxyUrl, stocks, appSecret]);

  // 주봉 캔들(날짜+종가) 배열로 5주/20주 이동평균을 구해서 현재 상태(golden/dead)를 판단
  // "이번 주(아직 마감 안 된 주)"인지는 마지막 캔들의 날짜가 이번 주(이번 주 월요일 이후)인지로 정확히 판별해서 제외한다.
  // (기존에는 무조건 마지막 1개를 제외했는데, 서버가 이미 완결된 주까지만 줄 때도 있어서 그때는 실수로 진짜 완결주 하나를 더 빼버려 계산이 흔들렸음)
  const computeMaState = (candles) => {
    if (!Array.isArray(candles) || candles.length === 0) return null;
    const parsed = candles
      .map((c) => ({ date: String(c.date || ""), close: Number(c.close) }))
      .filter((c) => c.date.length === 8 && !isNaN(c.close) && c.close > 0)
      .sort((a, b) => a.date.localeCompare(b.date));
    if (parsed.length === 0) return null;

    // 이번 주 월요일 날짜를 YYYYMMDD로 계산
    const today = new Date();
    const dow = today.getDay(); // 0=일 ~ 6=토
    const diffToMonday = dow === 0 ? 6 : dow - 1;
    const monday = new Date(today);
    monday.setDate(today.getDate() - diffToMonday);
    const mondayStr = `${monday.getFullYear()}${String(monday.getMonth() + 1).padStart(2, "0")}${String(monday.getDate()).padStart(2, "0")}`;

    const lastDate = parsed[parsed.length - 1].date;
    // 마지막 캔들이 이번 주(월요일 이후) 것이면 아직 마감 안 된 주이므로 제외, 아니면 이미 다 완결된 주들이므로 그대로 사용
    const completed = lastDate >= mondayStr ? parsed.slice(0, -1) : parsed;

    if (completed.length < 20) return null;
    const closes = completed.map((c) => c.close);
    const n = closes.length;
    const ma5 = closes.slice(n - 5).reduce((a, b) => a + b, 0) / 5;
    const ma20 = closes.slice(n - 20).reduce((a, b) => a + b, 0) / 20;
    if (ma5 === ma20) return { ma5, ma20, state: null };
    return { ma5, ma20, state: ma5 > ma20 ? "golden" : "dead" };
  };


  // 상태 + 현금비중(목표현금비중 대비)을 기준으로 매수/매도/중립 중 하나를 결정 (항상 셋 중 하나)
  const deriveAdviceLabel = (state) => {
    if (state === "golden" && cashRatio <= targetCashRatio) return "sell"; // 골든크로스인데 현금이 목표 이하 → 매도관점(현금 확보)
    if (state === "dead" && cashRatio >= targetCashRatio) return "buy";   // 데드크로스인데 현금이 목표 이상 → 매수관점(저가 매수)
    return "neutral";
  };

  // 코스피/코스닥 주봉 데이터 조회 — 하루 1회 계산 후 localStorage에 고정 저장 (앱을 몇 번을 다시 열어도 그날 안엔 절대 안 바뀜)
  const fetchWeeklySignals = useCallback(async () => {
    const todayStr = new Date().toISOString().slice(0, 10);
    try {
      const stored = JSON.parse(localStorage.getItem(WEEKLY_SIGNAL_STORE_KEY) || "null");
      if (stored && stored.date === todayStr && stored.data && stored.data.kospi && stored.data.kosdaq) {
        setWeeklySignal(stored.data);
        return; // 오늘 이미 "완전히 성공한" 계산이 있으면 그대로 사용
      }
    } catch (e) {}
    if (!proxyUrl) return;
    const base = proxyUrl.replace(/\/$/, "");
    const headers = appSecret ? { "x-app-secret": appSecret } : {};
    try {
      const [kospiRes, kosdaqRes] = await Promise.all([
        fetch(`${base}/index-history/0001`, { headers }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
        fetch(`${base}/index-history/1001`, { headers }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      ]);
      const toState = (histData) => {
        if (!histData || !Array.isArray(histData.candles)) return null;
        return computeMaState(histData.candles);
      };
      const result = { kospi: toState(kospiRes), kosdaq: toState(kosdaqRes) };
      setWeeklySignal(result);
      // 코스피·코스닥 둘 다 정상적으로 계산됐을 때만 "오늘 완료"로 저장 — 하나라도 실패(null)면 저장하지 않아서 다음에 자동으로 다시 시도함
      if (result.kospi && result.kosdaq) {
        try { localStorage.setItem(WEEKLY_SIGNAL_STORE_KEY, JSON.stringify({ date: todayStr, data: result })); } catch (e) {}
      }
    } catch (e) {}
  }, [proxyUrl, appSecret]);

  useEffect(() => {
    if (!loaded) return;
    fetchWeeklySignals();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded, proxyUrl]);

  // 개별 종목별 주봉 데이터 조회 — 마찬가지로 "완전히 성공"했을 때만 하루치로 고정 저장
  const fetchStockWeeklySignals = useCallback(async () => {
    const codes = stockCodes;
    if (codes.length === 0) return;
    const todayStr = new Date().toISOString().slice(0, 10);
    let stored = null;
    try { stored = JSON.parse(localStorage.getItem(STOCK_WEEKLY_SIGNAL_STORE_KEY) || "null"); } catch (e) {}
    if (stored && stored.date === todayStr) {
      // 오늘 이미 계산해둔 값이 있고, 지금 보유한 종목코드가 전부 "성공적으로(null 아님)" 들어있으면 재조회 안 함
      const hasAll = codes.every((c) => Object.prototype.hasOwnProperty.call(stored.data || {}, c) && stored.data[c]);
      if (hasAll) { setStockWeeklySignal(stored.data); return; }
    }
    if (!proxyUrl) return;
    const base = proxyUrl.replace(/\/$/, "");
    const headers = appSecret ? { "x-app-secret": appSecret } : {};
    try {
      const results = await Promise.all(
        codes.map((code) =>
          fetch(`${base}/stock-history/${code}`, { headers })
            .then((r) => (r.ok ? r.json() : null))
            .then((data) => ({ code, data }))
            .catch(() => ({ code, data: null }))
        )
      );
      const next = {};
      results.forEach(({ code, data }) => {
        if (!data || !Array.isArray(data.candles)) { next[code] = null; return; }
        next[code] = computeMaState(data.candles);
      });
      setStockWeeklySignal((prev) => ({ ...prev, ...next }));
      // 모든 종목이 정상적으로 계산됐을 때만 "오늘 완료"로 저장 — 하나라도 실패하면 저장 안 해서 다음에 자동 재시도
      const allOk = codes.every((c) => next[c]);
      if (allOk) {
        try { localStorage.setItem(STOCK_WEEKLY_SIGNAL_STORE_KEY, JSON.stringify({ date: todayStr, data: next })); } catch (e) {}
      }
    } catch (e) {}
  }, [proxyUrl, appSecret, stockCodes]);

  useEffect(() => {
    if (!loaded) return;
    fetchStockWeeklySignals();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded, proxyUrl, stockCodes]);

  // "차트" 화면용: 보유 종목 전체의 기간별(일/주/월/년) 종가 흐름을 가져온다.
  const fetchChartData = useCallback(async (period) => {
    const codes = stockCodes.filter(Boolean);
    if (codes.length === 0) { setChartData({}); setChartMsg("종목코드가 있는 보유종목이 없어요."); return; }
    if (!proxyUrl) { setChartMsg("먼저 설정에서 프록시 서버 주소를 입력하세요."); return; }
    setChartLoading(true);
    setChartMsg("");
    const base = proxyUrl.replace(/\/$/, "");
    const headers = appSecret ? { "x-app-secret": appSecret } : {};
    try {
      const [results, kospiRes, kosdaqRes] = await Promise.all([
        Promise.all(
          codes.map((code) =>
            fetch(`${base}/stock-history/${code}?period=${period}`, { headers })
              .then((r) => (r.ok ? r.json() : null))
              .then((data) => ({ code, data }))
              .catch(() => ({ code, data: null }))
          )
        ),
        fetch(`${base}/index-history/0001?period=${period}`, { headers }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
        fetch(`${base}/index-history/1001?period=${period}`, { headers }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      ]);
      const next = {};
      let failCount = 0;
      results.forEach(({ code, data }) => {
        if (!data || !Array.isArray(data.candles) || data.candles.length === 0) { failCount++; return; }
        next[code] = data.candles;
      });
      setChartData(next);
      setChartIndexData({
        kospi: kospiRes && Array.isArray(kospiRes.candles) && kospiRes.candles.length ? kospiRes.candles : null,
        kosdaq: kosdaqRes && Array.isArray(kosdaqRes.candles) && kosdaqRes.candles.length ? kosdaqRes.candles : null,
      });
      if (failCount > 0) setChartMsg(`${failCount}개 종목은 데이터를 못 받았어요. 서버가 깨어나는 중이면 잠시 후 다시 시도해 보세요.`);
    } catch (e) {
      setChartMsg("데이터를 가져오지 못했어요.");
    }
    setChartLoading(false);
  }, [proxyUrl, appSecret, stockCodes]);

  // 차트 화면에 들어오거나 기간 탭을 바꾸면 다시 불러온다.
  useEffect(() => {
    if (!loaded || mainView !== "chart") return;
    fetchChartData(chartPeriod);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded, mainView, chartPeriod, proxyUrl, stockCodes]);

  // 종목코드 마지막 자리가 0이 아니면 우선주로 보고, 본주 코드(마지막 자리 0)로 바꿔준다.
  const toCommonCode = (code) => (code && code.length === 6 && code[5] !== "0" ? code.slice(0, 5) + "0" : null);

  // PSR/ROE 화면용: 보유 종목 전체의 재무비율(ROE, 주당매출액)을 가져온다.
  // 우선주는 재무비율 데이터가 없는 경우가 많아서, 실패하면 본주 코드로 한 번 더 시도한다.
  const fetchFundamentals = useCallback(async () => {
    const codes = stockCodes.filter(Boolean);
    if (codes.length === 0) { setFundamentalsMsg("종목코드가 있는 보유종목이 없어요."); return; }
    if (!proxyUrl) { setFundamentalsMsg("먼저 설정에서 프록시 서버 주소를 입력하세요."); return; }
    setFundamentalsLoading(true);
    setFundamentalsMsg("");
    const base = proxyUrl.replace(/\/$/, "");
    const headers = appSecret ? { "x-app-secret": appSecret } : {};
    const fetchOne = (code) =>
      fetch(`${base}/stock-fundamentals/${code}`, { headers })
        .then((r) => (r.ok ? r.json() : null))
        .catch(() => null);
    try {
      const results = await Promise.all(
        codes.map(async (code) => {
          let data = await fetchOne(code);
          let usedCommon = false;
          if (!data || !Array.isArray(data.periods) || data.periods.length === 0) {
            const common = toCommonCode(code);
            if (common) {
              const data2 = await fetchOne(common);
              if (data2 && Array.isArray(data2.periods) && data2.periods.length > 0) { data = data2; usedCommon = true; }
            }
          }
          return { code, data, usedCommon };
        })
      );
      setFundamentalsData((prev) => {
        const next = { ...prev };
        let failCount = 0;
        results.forEach(({ code, data, usedCommon }) => {
          if (!data || !Array.isArray(data.periods) || data.periods.length === 0) { failCount++; return; }
          next[code] = { periods: data.periods, latest: data.latest, divUsed: data.divUsed, usedCommon };
        });
        if (failCount > 0) setFundamentalsMsg(`${failCount}개 종목은 재무비율을 못 받았어요 (해당 종목에 데이터가 없을 수 있어요).`);
        return next;
      });
    } catch (e) {
      setFundamentalsMsg("재무비율을 가져오지 못했어요.");
    }
    setFundamentalsLoading(false);
  }, [proxyUrl, appSecret, stockCodes]);

  useEffect(() => {
    if (!loaded || (mainView !== "psrChart" && mainView !== "roeChart")) return;
    const missing = stockCodes.filter((c) => !fundamentalsData[c]);
    if (missing.length === 0 || fundamentalsLoading) return;
    fetchFundamentals();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded, mainView, stockCodes]);

  // 개별 차트에서 선택한 종목이 바뀌면, 그 종목의 소속 업종 지수를 가져와서 중간선으로 겹쳐 그린다.
  useEffect(() => {
    if (!loaded || !proxyUrl || !chartSelected) { setChartSectorData(null); return; }
    const stock = stocks.find((s) => s.code === chartSelected);
    const matched = stock ? matchSectorGroup(stock.industryName) : null;
    if (!matched) { setChartSectorData(null); return; }
    const base = proxyUrl.replace(/\/$/, "");
    const headers = appSecret ? { "x-app-secret": appSecret } : {};
    fetch(`${base}/index-history/${matched.code}?period=${chartPeriod}`, { headers })
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => {
        setChartSectorData(data && Array.isArray(data.candles) && data.candles.length >= 2
          ? { name: matched.sectorName, candles: data.candles }
          : null);
      })
      .catch(() => setChartSectorData(null));
  }, [loaded, proxyUrl, appSecret, chartSelected, chartPeriod, stocks, matchSectorGroup]);

  // 업종지수 추이 — 카드를 펼쳤을 때 시장+기간별로 한 번만 불러온다 (요청이 20건이라 자동 로딩은 하지 않음).
  const fetchSectorData = useCallback(async (market, period) => {
    if (!proxyUrl) { setSectorMsg("먼저 설정에서 프록시 서버 주소를 입력하세요."); return; }
    const group = SECTOR_GROUPS[market];
    if (!group) return;
    setSectorLoading(true);
    setSectorMsg("");
    const base = proxyUrl.replace(/\/$/, "");
    const headers = appSecret ? { "x-app-secret": appSecret } : {};
    const defaultDays = { D: 200, W: 220, M: 1100, Y: 4000 };
    const days = defaultDays[period] || 220;
    const toPts = (candles) => {
      const b = num(candles[0].close);
      return candles.map((c) => ({ date: c.date, pct: b !== 0 ? ((num(c.close) - b) / b) * 100 : 0 }));
    };
    try {
      const [results, kospiRes, kosdaqRes] = await Promise.all([
        Promise.all(
          group.list.map((s) =>
            fetch(`${base}/index-history/${s.code}?period=${period}&days=${days}`, { headers })
              .then((r) => (r.ok ? r.json() : null))
              .then((data) => ({ ...s, candles: data && Array.isArray(data.candles) ? data.candles : null }))
              .catch(() => ({ ...s, candles: null }))
          )
        ),
        fetch(`${base}/index-history/0001?period=${period}&days=${days}`, { headers }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
        fetch(`${base}/index-history/1001?period=${period}&days=${days}`, { headers }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      ]);
      const ok = results
        .filter((s) => s.candles && s.candles.length >= 2)
        .map((s) => {
          const pts = toPts(s.candles);
          return { code: s.code, name: s.name, reps: s.reps, pts, last: pts[pts.length - 1].pct };
        })
        .sort((a, b) => b.last - a.last);
      setSectorData((prev) => ({ ...prev, [market + ":" + period]: ok }));
      setSectorRef((prev) => ({
        ...prev,
        [period]: {
          kospi: kospiRes && Array.isArray(kospiRes.candles) && kospiRes.candles.length >= 2 ? toPts(kospiRes.candles) : null,
          kosdaq: kosdaqRes && Array.isArray(kosdaqRes.candles) && kosdaqRes.candles.length >= 2 ? toPts(kosdaqRes.candles) : null,
        },
      }));
      // 처음 들어올 땐 아무것도 선택 안 된 목록 상태로 시작한다 (탭해야 개별 차트가 열림)
      if (ok.length === 0) setSectorMsg("업종지수 데이터를 받지 못했어요. 서버가 깨어나는 중이면 잠시 후 다시 시도해 주세요.");
      else if (ok.length < group.list.length) setSectorMsg(`${group.list.length - ok.length}개 업종은 데이터를 받지 못해 제외했어요.`);
    } catch (e) {
      setSectorMsg("업종지수 데이터를 가져오지 못했어요.");
    }
    setSectorLoading(false);
  }, [proxyUrl, appSecret]);

  useEffect(() => {
    if (!loaded || mainView !== "sectorChart") return;
    const key = sectorMarket + ":" + sectorPeriod;
    if (sectorData[key] || sectorLoading) return;
    fetchSectorData(sectorMarket, sectorPeriod);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded, mainView, sectorMarket, sectorPeriod]);

  // 서버가 불안정해서 계산이 실패했을 때, 완전히 성공할 때까지 자동으로 재시도 (30초 간격)
  // ref로 최신값을 참조해서, 종목 입력 중(타이핑)에 타이머가 계속 리셋되지 않도록 함
  const weeklySignalRef = useRef(weeklySignal);
  const stockWeeklySignalRef = useRef(stockWeeklySignal);
  const stocksRef = useRef(stocks);
  const fetchWeeklySignalsRef = useRef(fetchWeeklySignals);
  const fetchStockWeeklySignalsRef = useRef(fetchStockWeeklySignals);
  useEffect(() => { weeklySignalRef.current = weeklySignal; }, [weeklySignal]);
  useEffect(() => { stockWeeklySignalRef.current = stockWeeklySignal; }, [stockWeeklySignal]);
  useEffect(() => { stocksRef.current = stocks; }, [stocks]);
  useEffect(() => { fetchWeeklySignalsRef.current = fetchWeeklySignals; }, [fetchWeeklySignals]);
  useEffect(() => { fetchStockWeeklySignalsRef.current = fetchStockWeeklySignals; }, [fetchStockWeeklySignals]);

  useEffect(() => {
    if (!loaded || !proxyUrl) return;
    const intervalId = setInterval(() => {
      const marketDone = weeklySignalRef.current.kospi && weeklySignalRef.current.kosdaq;
      if (!marketDone) fetchWeeklySignalsRef.current();

      const codes = [...new Set(stocksRef.current.filter((s) => s.name && s.code).map((s) => s.code))];
      const stockDone = codes.length === 0 || codes.every((c) => stockWeeklySignalRef.current[c]);
      if (!stockDone) fetchStockWeeklySignalsRef.current();
    }, 30000);
    return () => clearInterval(intervalId);
  }, [loaded, proxyUrl]);


  // 코스피/코스닥 각각 매수/매도/중립 라벨 (항상 표시)
  const marketAdviceList = useMemo(() => {
    return [["kospi", "코스피"], ["kosdaq", "코스닥"]].map(([key, label]) => {
      const s = weeklySignal[key];
      const adv = s ? deriveAdviceLabel(s.state) : "neutral";
      const text = adv === "sell" ? `${label} 매도관점(현금 20%~30%)`
        : adv === "buy" ? `${label} 매수관점(현금 10%~20%)`
        : `${label} 중립관점(현금 20%)`;
      return { key, label, type: adv, text };
    });
  }, [weeklySignal, cashRatio, targetCashRatio]);

  // 새로고침이 실제로 반영된 다음(state 커밋 이후)에 정렬 재계산 — 타이밍 문제 없이 안전하게 동작
  useEffect(() => {
    if (priceRefreshTick > 0) recomputeStockOrder();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [priceRefreshTick]);

  // 앱을 열 때마다 자동으로 한 번 실시간 시세 새로고침 실행
  useEffect(() => {
    if (!loaded) return;
    if (!proxyUrl) return;
    refreshPrices();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded, proxyUrl]);

  // 앱이 실행되어 있는 동안 2분마다 자동으로 실시간 시세 새로고침
  const refreshPricesRef = useRef(refreshPrices);
  useEffect(() => { refreshPricesRef.current = refreshPrices; }, [refreshPrices]);
  useEffect(() => {
    if (!loaded || !proxyUrl) return;
    const intervalId = setInterval(() => {
      refreshPricesRef.current();
    }, 2 * 60 * 1000);
    return () => clearInterval(intervalId);
  }, [loaded, proxyUrl]);

  const exportDataAsText = () => {
    const data = { stocks, cashAccounts, targetCashRatio, snapshots, rebalanceLog };
    setImportText(JSON.stringify(data, null, 2));
    setImportMsg("현재 데이터(종목·현금·저장된 스냅샷·리밸런싱 이력 전부)를 아래 상자에 불러왔어요. 전체 선택해서 복사해두시면 백업이 돼요.");
  };

  const applyImportedData = () => {
    try {
      const parsed = JSON.parse(importText);
      if (!Array.isArray(parsed.stocks) || !Array.isArray(parsed.cashAccounts)) {
        throw new Error("형식이 올바르지 않습니다 (stocks, cashAccounts 배열 필요).");
      }
      const newStocks = parsed.stocks.map((s) => ({ id: genId(), name: "", code: "", qty: "", buyPrice: "", curPrice: "", prevClose: "", ...s, virtualSellQty: "", virtualBuyQty: "" }));
      const newCash = parsed.cashAccounts.map((c) => ({ id: genId(), name: "", cash: "", pledged: "", used: "", ...c }));
      setStocks(newStocks);
      setCashAccounts(newCash);
      if (typeof parsed.targetCashRatio === "number") setTargetCashRatio(parsed.targetCashRatio);
      if (Array.isArray(parsed.snapshots)) {
        setSnapshots(parsed.snapshots);
        try { localStorage.setItem(SNAPSHOTS_KEY, JSON.stringify(parsed.snapshots)); } catch (e) {}
      }
      if (Array.isArray(parsed.rebalanceLog)) {
        const migrated = parsed.rebalanceLog.map((g) => (typeof g === "string" ? { date: g, items: [] } : g));
        setRebalanceLog(migrated);
        try { localStorage.setItem(REBALANCE_LOG_KEY, JSON.stringify(migrated)); } catch (e) {}
      }
      setImportMsg("✅ 데이터를 불러왔어요 (스냅샷·리밸런싱 이력 포함).");
    } catch (e) {
      setImportMsg("❌ 불러오기 실패: " + String(e.message || e));
    }
  };

  const saveSnapshot = (isAuto) => {
    const now = new Date();
    const label = now.toLocaleString("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) + (isAuto ? " (자동)" : "");
    const snap = {
      id: genId(),
      label,
      savedAt: now.toISOString(),
      stocks,
      cashAccounts,
      targetCashRatio,
    };
    setSnapshots((prev) => {
      const todayStr = now.toISOString().slice(0, 10);
      const withoutToday = prev.filter((s) => (s.savedAt || "").slice(0, 10) !== todayStr);
      const next = [snap, ...withoutToday];
      try { localStorage.setItem(SNAPSHOTS_KEY, JSON.stringify(next)); } catch (e) {}
      return next;
    });
    setSnapshotMsg(isAuto ? `📅 자동 저장 완료 (${label})` : `✅ ${label} 기준으로 저장했어요.`);
    setTimeout(() => setSnapshotMsg(""), 4000);
  };

  // 앱을 실행할 때마다 그날 첫 실행이면 "현재날짜로보관"을 자동 실행 (하루 1회만)
  useEffect(() => {
    if (!loaded) return;
    try {
      const todayStr = new Date().toISOString().slice(0, 10);
      const lastAuto = localStorage.getItem(AUTOSAVE_KEY);
      if (lastAuto !== todayStr) {
        saveSnapshot(true);
        localStorage.setItem(AUTOSAVE_KEY, todayStr);
      }
    } catch (e) {}
    // 혹시 미리보기 상태로 남아있었다면, 실행 시 항상 최신 데이터로 복귀
    setIsPreviewing(false);
    setPreviewBackup(null);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded]);

  // 앱을 실행할 때마다(매번) 그 시점의 전체 데이터를 자동 백업 — 최근 10회까지 보관, 언제든 복원 가능
  useEffect(() => {
    if (!loaded) return;
    try {
      const entry = {
        id: genId(),
        savedAt: new Date().toISOString(),
        label: new Date().toLocaleString("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }),
        stocks, cashAccounts, targetCashRatio, snapshots, rebalanceLog,
      };
      const rawBackups = localStorage.getItem(LAUNCH_BACKUP_KEY);
      const prevBackups = rawBackups ? JSON.parse(rawBackups) : [];
      const nextBackups = [entry, ...prevBackups].slice(0, 10);
      localStorage.setItem(LAUNCH_BACKUP_KEY, JSON.stringify(nextBackups));
      setLaunchBackups(nextBackups);
    } catch (e) {}
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded]);

  const restoreFromLaunchBackup = (id) => {
    const b = launchBackups.find((x) => x.id === id);
    if (!b) return;
    if (!window.confirm(`"${b.label}" 시점 자동백업으로 복원할까요?\n지금 화면에 있는 데이터는 덮어써집니다.`)) return;
    setStocks(b.stocks || []);
    setCashAccounts(b.cashAccounts || []);
    if (typeof b.targetCashRatio === "number") setTargetCashRatio(b.targetCashRatio);
    if (Array.isArray(b.snapshots)) {
      setSnapshots(b.snapshots);
      try { localStorage.setItem(SNAPSHOTS_KEY, JSON.stringify(b.snapshots)); } catch (e) {}
    }
    if (Array.isArray(b.rebalanceLog)) {
      setRebalanceLog(b.rebalanceLog);
      try { localStorage.setItem(REBALANCE_LOG_KEY, JSON.stringify(b.rebalanceLog)); } catch (e) {}
    }
    setIsPreviewing(false);
    setPreviewBackup(null);
    setShowBackupList(false);
    setSnapshotMsg(`↩ ${b.label} 자동백업으로 복원했어요.`);
    setTimeout(() => setSnapshotMsg(""), 4000);
  };

  const loadSnapshot = (id) => {
    const snap = snapshots.find((s) => s.id === id);
    if (!snap) return;
    if (!isPreviewing) {
      // 실제(최신) 데이터를 백업해뒀다가, 미리보기를 끝내면 그대로 복귀시킨다
      setPreviewBackup({ stocks, cashAccounts, targetCashRatio });
    }
    setStocks((snap.stocks || []).map((s) => ({ ...s, virtualSellQty: "", virtualBuyQty: "" })));
    setCashAccounts(snap.cashAccounts || []);
    if (typeof snap.targetCashRatio === "number") setTargetCashRatio(snap.targetCashRatio);
    setIsPreviewing(true);
    setShowSnapshotList(false);
    setSnapshotMsg(`👁 ${snap.label} 데이터를 보는 중이에요 (보관용 미리보기, 저장되지 않아요).`);
  };

  const exitPreview = () => {
    if (previewBackup) {
      setStocks(previewBackup.stocks);
      setCashAccounts(previewBackup.cashAccounts);
      setTargetCashRatio(previewBackup.targetCashRatio);
    }
    setIsPreviewing(false);
    setPreviewBackup(null);
    setSnapshotMsg("↩ 최신(실시간) 데이터로 돌아왔어요.");
    setTimeout(() => setSnapshotMsg(""), 3000);
  };

  const deleteSnapshot = (id) => {
    setSnapshots((prev) => {
      const next = prev.filter((s) => s.id !== id);
      try { localStorage.setItem(SNAPSHOTS_KEY, JSON.stringify(next)); } catch (e) {}
      return next;
    });
  };

  const cashRatioPct = Math.max(0, Math.min(100, cashRatio * 100));

  const exportToExcel = () => {
    const stockRows = sortedStockRows.filter(r => r.hasName).map((r) => ({
      "종목명": r.name, "종목코드": r.code, "주식수": r.qty, "매입가": r.buy, "현재가": r.cur,
      "투자금액": Math.round(r.investAmt), "평가금액": Math.round(r.valAmt), "평가손익": Math.round(r.pnl),
      "수익률(%)": r.returnRate != null ? Number((r.returnRate * 100).toFixed(2)) : "",
      "수익기준비중(%)": r.profitWeight != null ? Number((r.profitWeight * 100).toFixed(2)) : "",
      "매입기준비중(%)": r.purchaseWeight != null ? Number((r.purchaseWeight * 100).toFixed(2)) : "",
      "비중평균(%)": r.avgWeight != null ? Number((r.avgWeight * 100).toFixed(2)) : "",
    }));
    const cashRows = sortedCashRows.filter(a => a.name).map((a) => ({
      "계좌명": a.name, "현금": a.cash, "빌려투자한돈": a.pledged, "사용한돈/투자한돈": a.used, "합계": Math.round(a.total),
    }));
    const summaryRows = [
      { "항목": "총평가금액", "값": Math.round(totalPortfolioValue) },
      { "항목": "주식평가액", "값": Math.round(stockCalc.totalVal) },
      { "항목": "투자원금", "값": Math.round(investmentPrincipal) },
      { "항목": "총수익", "값": Math.round(totalReturnAmt) },
      { "항목": "총수익률(%)", "값": totalReturnRate != null ? Number((totalReturnRate * 100).toFixed(2)) : "" },
      { "항목": "현금비중(%)", "값": Number((cashRatio * 100).toFixed(2)) },
      { "항목": "목표현금비중(%)", "값": Number((targetCashRatio * 100).toFixed(2)) },
      { "항목": "투자가능현금", "값": Math.round(investableCash) },
      { "항목": "보유현금합계", "값": Math.round(cashCalc.totalCash) },
    ];
    // 리밸런싱 이력 (날짜별 종목 변경 내역을 한 줄씩 펼쳐서)
    const rebalanceRows = [];
    rebalanceLog.forEach((g) => {
      (g.items || []).forEach((it) => {
        rebalanceRows.push({ "날짜": g.date, "종목명": it.name, "주식수": it.qty, "매입가": it.buyPrice, "구분": it.direction === "sell" ? "매도" : it.direction === "buy" ? "매수" : "" });
      });
    });
    // 보관(스냅샷) 목록
    const snapshotRows = snapshots.map((s) => ({
      "보관 라벨": s.label,
      "저장시각": s.savedAt,
      "종목수": (s.stocks || []).filter((x) => x.name).length,
      "현금계좌수": (s.cashAccounts || []).filter((x) => x.name).length,
    }));
    // 투자원금 증가/감소 이력
    const principalRows = cashSettleLog.map((e) => ({
      "날짜": e.date, "시각": e.time, "계좌명": e.accountName,
      "구분": e.type === "repay" ? "빌린돈 상환" : e.type === "borrow" ? "빌려투자한돈 증가" : e.type === "spend" ? "사용한돈" : e.type === "invest" ? "투자한돈" : "사용한돈 정산",
      "증가/감소금액": (e.type === "borrow" || e.type === "invest") ? Math.round(Math.abs(e.amount)) : -Math.round(Math.abs(e.amount)),
      "이전값": Math.round(e.cashBefore), "이후값": Math.round(e.cashAfter),
    }));
    // 자동 백업 목록
    const backupRows = launchBackups.map((b) => ({
      "저장시각": b.label,
      "종목수": (b.stocks || []).filter((x) => x.name).length,
      "현금계좌수": (b.cashAccounts || []).filter((x) => x.name).length,
    }));

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRows), "요약");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(stockRows), "종목");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cashRows), "현금계좌");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rebalanceRows.length ? rebalanceRows : [{ "안내": "기록 없음" }]), "리밸런싱이력");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(snapshotRows.length ? snapshotRows : [{ "안내": "기록 없음" }]), "보관목록");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(principalRows.length ? principalRows : [{ "안내": "기록 없음" }]), "투자원금증가감소이력");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(backupRows.length ? backupRows : [{ "안내": "기록 없음" }]), "자동백업목록");
    const today = new Date();
    const y = String(today.getFullYear()).slice(2);
    const m = String(today.getMonth() + 1).padStart(2, "0");
    const d = String(today.getDate()).padStart(2, "0");
    XLSX.writeFile(wb, `PORTFOLIO_${y}${m}${d}.xlsx`);
  };

  if (isObscured && lockEnabled && !isLocked) {
    return (
      <div style={{ background: "#12151b", minHeight: "100vh", color: "#e7eaf0", fontFamily: "'Pretendard','Apple SD Gothic Neo',sans-serif", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>

        const allRows = stocks

            const periodPts = f.periods
              .map((p) => {
                const v = metric === "psr"
                  ? (p.sps && num(p.sps) !== 0 ? num(s.curPrice) / num(p.sps) : null)
                  : metric === "roe"
                  ? (p.roe !== null && p.roe !== undefined ? num(p.roe) : null)
                  : (p.revenueGrowth !== null && p.revenueGrowth !== undefined ? num(p.revenueGrowth) : null);
                return { period: p.period, value: v };
              })
              .filter((p) => p.value !== null && !isNaN(p.value));
            if (periodPts.length === 0) return null;
            const annualPts = deriveAnnual(periodPts);
            if (annualPts.length === 0) return null;
            const value = annualPts[annualPts.length - 1].value;
            return { code: s.code, name: s.name, value, annualPts, divUsed: f.divUsed, usedCommon: f.usedCommon };

              {fundamentalsMsg && <div style={{ color: "#8993a6", fontSize: 11, marginBottom: 8 }}>{fundamentalsMsg}</div>}
              {!fundamentalsLoading && styled.length === 0 && (

                      <span style={{ color: "#5a6274", minWidth: 14, textAlign: "right", flexShrink: 0 }}>{i + 1}</span>

                            <span style={{ color: "#5a6274", fontSize: 8 }}>{fmtYear(p.year)}</span>
                            <span style={{ fontWeight: 700, color: p.value > 0 ? "#e8544b" : p.value < 0 ? "#4c8dff" : "#8993a6" }}>{fmtVal(p.value)}</span>

                      const vPad = Math.max((vMax - vMin) * 0.1, 0.1);

                      const xOf = (idx, len) => padL + (len <= 1 ? 0 : (idx / (len - 1)) * plotW);

          <div style={{ fontSize: 16, fontWeight: 700 }}>{fmt(cashCalc.totalCash)}원</div>
        </div>
        <div style={{ textAlign: "right" }}>
          <div className="lbl">투자가능현금</div>
          <div style={{ fontSize: 16, fontWeight: 700, color: investableCash >= 0 ? "#e8544b" : "#4c8dff" }}>
            {investableCash >= 0 ? "+" : ""}{fmt(investableCash)}원
          </div>
        </div>
      </div>
      <div style={{ padding: "18px 16px 8px", fontSize: 13, fontWeight: 700, color: "#c9974a" }}>현금 계좌</div>
      <div style={{ padding: "0 16px", display: "flex", flexDirection: "column", gap: 8 }}>
        {sortedCashRows.map((a, idx) => (
          <div key={a.id} className="card tnum" style={{ padding: 8 }}>
            <div style={{ display: "flex", gap: 8, marginBottom: 4, alignItems: "center" }}>
              <span style={{ flexShrink: 0, fontSize: 12, color: "#8993a6", fontWeight: 700, minWidth: 14, textAlign: "right" }}>{idx === 0 ? "📌" : idx + 1}</span>
              <input className="field" placeholder="계좌명" value={a.name} onChange={(e) => updateCash(a.id, "name", e.target.value)} style={{ flex: 2, fontWeight: 600 }} />
              <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                <button className="iconbtn" onClick={() => moveCash(a.id, -1)} disabled={idx <= 1} style={{ padding: "0 6px", color: idx <= 1 ? "#3a4150" : "#8993a6", fontSize: 12, lineHeight: 1 }}>▲</button>
                <button className="iconbtn" onClick={() => moveCash(a.id, 1)} disabled={idx === 0 || idx === sortedCashRows.length - 1} style={{ padding: "0 6px", color: (idx === 0 || idx === sortedCashRows.length - 1) ? "#3a4150" : "#8993a6", fontSize: 12, lineHeight: 1 }}>▼</button>
              </div>
              <button className="iconbtn" onClick={() => removeCash(a.id)} style={{ padding: 4, color:"#5a6274", fontSize:14 }}>🗑</button>
            </div>
            {idx === 0 ? (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 4 }}>
                <div>
                  <div className="lbl" style={{ textAlign: "center" }}>현금(주투자계좌)</div>
                  <input className="field" type="text" inputMode="numeric" value={num(a.cash) === 0 ? "" : toDisplay(a.cash)} onChange={(e) => updateCash(a.id, "cash", fromDisplay(e.target.value))} placeholder="금액입력" />
                  <div style={{ fontSize: 9, color: "#5a6274", marginTop: 3, whiteSpace: "nowrap" }}>투자하거나 현금사용</div>
                </div>
                <div></div>
                <div>
                  <div className="lbl" style={{ textAlign: "center" }}>사용한돈/투자한돈</div>
                  <input className="field" type="text" inputMode="numeric" value={num(a.used) === 0 ? "" : toDisplay(a.used)} onChange={(e) => updateCash(a.id, "used", fromDisplay(e.target.value))} placeholder="금액입력" style={{ marginBottom: 3 }} />
                  <div style={{ display: "flex", gap: 4, justifyContent: "center" }}>
                    <button
                      type="button"
                      onClick={() => applyUsedAmount(a.id, "spend")}
                      style={{ padding: "4px 8px", borderRadius: 6, fontSize: 11, fontWeight: 700, border: "1px solid #4c8dff", background: "rgba(76,141,255,0.12)", color: "#4c8dff", whiteSpace: "nowrap" }}
                    >
                      ➖ 사용
                    </button>
                    <button
                      type="button"
                      onClick={() => applyUsedAmount(a.id, "invest")}
                      style={{ padding: "4px 8px", borderRadius: 6, fontSize: 11, fontWeight: 700, border: "1px solid #e8544b", background: "rgba(232,84,75,0.12)", color: "#e8544b", whiteSpace: "nowrap" }}
                    >
                      ➕ 투자
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 4 }}>
                <div>
                  <div className="lbl" style={{ textAlign: "center" }}>현금(보조투자계좌)</div>
                  <input className="field" type="text" inputMode="numeric" value={num(a.cash) === 0 ? "" : toDisplay(a.cash)} onChange={(e) => updateCash(a.id, "cash", fromDisplay(e.target.value))} placeholder="금액입력" />
                  <div style={{ fontSize: 9, color: "#5a6274", marginTop: 3, whiteSpace: "nowrap" }}>투자금으로 빌려주거나 갚을 수 있음</div>
                </div>
                <div>
                  <div className="lbl" style={{ textAlign: "center" }}>빌려투자한돈</div>
                  <input className="field" type="text" inputMode="numeric" value={num(a.pledged) === 0 ? "" : toDisplay(a.pledged)} onChange={(e) => updateCash(a.id, "pledged", fromDisplay(e.target.value))} onFocus={() => handlePledgedFocus(a.id, a.pledged)} onBlur={() => handlePledgedBlur(a.id)} placeholder="금액입력" />
                  <div className="lbl" style={{ marginTop: 4, textAlign: "center" }}>이자(연10%, 일할)</div>
                  <input className="field" type="text" inputMode="numeric" value={num(a.interest) === 0 ? "" : toDisplay(a.interest)} onChange={(e) => updateInterestCapped(a.id, fromDisplay(e.target.value))} onFocus={() => handleInterestFocus(a.id, a.interest)} onBlur={() => handleInterestBlur(a.id)} placeholder="자동 계산" />
                </div>
                <div>
                  <div className="lbl" style={{ textAlign: "center" }}>상환한돈/대출한돈</div>
                  <input className="field" type="text" inputMode="numeric" value={num(a.repayLoan) === 0 ? "" : toDisplay(a.repayLoan)} onChange={(e) => updateCash(a.id, "repayLoan", fromDisplay(e.target.value))} placeholder="금액입력" style={{ marginBottom: 3 }} />
                  <div style={{ display: "flex", gap: 4, justifyContent: "center" }}>
                    <button
                      type="button"
                      onClick={() => applyPledgedAmount(a.id, "repay")}
                      style={{ padding: "4px 8px", borderRadius: 6, fontSize: 11, fontWeight: 700, border: "1px solid #4c8dff", background: "rgba(76,141,255,0.12)", color: "#4c8dff", whiteSpace: "nowrap" }}
                    >
                      ➖ 상환
                    </button>
                    <button
                      type="button"
                      onClick={() => applyPledgedAmount(a.id, "borrow")}
                      style={{ padding: "4px 8px", borderRadius: 6, fontSize: 11, fontWeight: 700, border: "1px solid #e8544b", background: "rgba(232,84,75,0.12)", color: "#e8544b", whiteSpace: "nowrap" }}
                    >
                      ➕ 대출
                    </button>
                  </div>
                </div>
              </div>
            )}
            <div style={{ textAlign: "right", marginTop: 4, fontSize: 13, color: "#8993a6" }}>합계 <span style={{ color: "#e7eaf0", fontWeight: 700 }}>{fmt(a.total)}원</span></div>
          </div>
        ))}
        <button className="iconbtn" onClick={addCash} style={{ border: "1px dashed #3a4150", color: "#8993a6", borderRadius: 10, padding: "10px 0", fontSize: 13, marginBottom: 20 }}>+ 계좌 추가</button>
      </div>
      </div>
      )}

      {mainView === "home" && (<>
      <div style={{ padding: "0 16px 14px", display: "flex", gap: 10 }}>
        <button onClick={() => setMainView("stocks")} className="iconbtn" style={{ flex: 1, padding: "12px 0", borderRadius: 10, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 13 }}>
          📈 보유종목
        </button>
        <button onClick={() => setMainView("cash")} className="iconbtn" style={{ flex: 1, padding: "12px 0", borderRadius: 10, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 13 }}>
          💰 현금계좌
        </button>
        <button onClick={() => setMainView("view")} className="iconbtn" style={{ flex: 1, padding: "12px 0", borderRadius: 10, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 13 }}>
          👁 보기
        </button>
        <button onClick={() => setMainView("settings")} className="iconbtn" style={{ flex: 1, padding: "12px 0", borderRadius: 10, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 13 }}>
          ⚙ 설정
        </button>
      </div>

      <div style={{ padding: "0 16px 20px", display: "flex", gap: 6, flexWrap: "wrap" }}>
        <button
          onClick={() => { setSectorSelected(null); setMainView("sectorChart"); }}
          className="iconbtn"
          style={{ padding: "8px 8px", borderRadius: 10, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11, whiteSpace: "nowrap" }}
        >
          🏭 업종챠트
        </button>
        <button
          onClick={() => { setChartSelected(null); setMainView("chart"); }}
          className="iconbtn"
          style={{ padding: "8px 8px", borderRadius: 10, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11, whiteSpace: "nowrap" }}
        >
          📈 종목챠트
        </button>
        <button
          onClick={() => { setFundSelected(null); setMainView("psrChart"); }}
          className="iconbtn"
          style={{ padding: "8px 8px", borderRadius: 10, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11, whiteSpace: "nowrap" }}
        >
          PSR
        </button>
        <button
          onClick={() => { setFundSelected(null); setMainView("roeChart"); }}
          className="iconbtn"
          style={{ padding: "8px 8px", borderRadius: 10, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11, whiteSpace: "nowrap" }}
        >
          ROE
        </button>
        <button
          onClick={() => { setFundSelected(null); setMainView("growthChart"); }}
          className="iconbtn"
          style={{ marginLeft: "auto", padding: "8px 8px", borderRadius: 10, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11, whiteSpace: "nowrap" }}
        >
          📊 매출액성장률
        </button>
      </div>
      </>)}

      {toast && (
        <div style={{ position: "fixed", left: 16, right: 16, bottom: 24, background: "#1a1f28", border: "1px solid #c9974a", color: "#e7eaf0", borderRadius: 10, padding: "12px 14px", fontSize: 13, zIndex: 100, boxShadow: "0 4px 20px rgba(0,0,0,0.4)" }}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PortfolioApp />);
</script>
<script>
// 위 <script id="app-source">는 type="text/plain"이라 브라우저가 자동 실행하지 않는다.
// 여기서 직접 Babel로 변환하고 실행해서, 오류가 나면 "Script error."로 뭉개지지 않고 진짜 원인이 화면에 보이게 한다.
(function () {
  try {
    var src = document.getElementById('app-source').textContent;
    var out = Babel.transform(src, { presets: ['react'], filename: 'app.jsx' }).code;
    try {
      (0, eval)(out);
    } catch (runErr) {
      window.__showFatalError('앱 실행 중 오류\n\n' + ((runErr && runErr.stack) ? runErr.stack : String(runErr)));
    }
  } catch (compileErr) {
    window.__showFatalError('코드 변환(문법) 오류\n\n' + (compileErr && compileErr.message ? compileErr.message : String(compileErr)));
  }
})();
</script>
</body>
</html>
